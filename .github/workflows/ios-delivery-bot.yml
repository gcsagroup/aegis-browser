name: iOS Delivery · Bot
run-name: iOS Bot ${{ inputs.operation }} ${{ inputs.version }}(${{ inputs.build }})
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        description: Authorized delivery operation
        options: [Status, Wait, Package, Package and upload, Draft]
        default: Status
      version:
        type: string
        description: Marketing version
        required: true
      build:
        type: string
        description: Exact unused build for a new package
        required: true
      product:
        type: choice
        description: Product profile
        options: [Beta, Alpha, Release]
        default: Beta
      signing_mode:
        type: choice
        description: Signing mode for new packages
        options: [cloud, manual]
        default: cloud
permissions:
  contents: read
  actions: read
concurrency:
  group: ios-delivery-bot-${{ github.repository }}
  cancel-in-progress: false
jobs:
  controller:
    if: ${{ github.repository == 'gcsagroup/aegis-browser' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    environment: aegis-ios-bot
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Require current administrator for this controller request
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/ios-operator.mjs --context controller
      - name: Dispatch and monitor exact App-owned delivery runs
        env:
          BOT_INPUTS: ${{ toJSON(inputs) }}
          AEGIS_IOS_DELIVERY_BOT: ${{ vars.AEGIS_IOS_DELIVERY_BOT }}
          AEGIS_IOS_BOT_INSTALLATION_ID: ${{ vars.AEGIS_IOS_BOT_INSTALLATION_ID }}
          AEGIS_IOS_BOT_PRIVATE_KEY: ${{ secrets.AEGIS_IOS_BOT_PRIVATE_KEY }}
        run: bash scripts/ci/run-ios-delivery-bot.sh
