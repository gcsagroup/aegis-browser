name: iOS Fork Access
run-name: iOS Fork Access ${{ github.ref_name }}
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - promote/ios-access-closed-loop-2cd7
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ios-fork-access-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  contracts:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Access evidence contracts without App Store signing
        run: |
          node --test apps/browser/scripts/ios-access-phase1-evidence_test.mjs
          python3 -B -m unittest scripts/release/test_macos_dmg.py
  simulator:
    if: ${{ github.event_name == 'workflow_dispatch' && (github.repository == 'quinn521/aegis-browser' || github.repository == 'gcsagroup/aegis-browser') }}
    runs-on: ${{ fromJSON(format('["self-hosted","macOS","ARM64","{0}"]', vars.AEGIS_IOS_RUNNER_LABEL)) }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run AccessKit simulator tests
        run: bash scripts/release/ios-access-tests.sh
