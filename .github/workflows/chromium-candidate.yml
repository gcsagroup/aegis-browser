name: Chromium 三平台候选构建
on:
  workflow_dispatch:
    inputs:
      windows_hosted_trial:
        description: '仅运行已批准的 Windows 32 核付费试跑（最多 4 小时，不自动重试）'
        type: boolean
        default: false
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
concurrency:
  group: aegis-candidate-build
  cancel-in-progress: false
jobs:
  preflight:
    if: ${{ !inputs.windows_hosted_trial }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 验证编排脚本
        run: python -m unittest discover -s apps/browser/scripts/ci -p '*_test.py'
      - name: 检查构建机接入状态
        env:
          RUNNERS_READY: ${{ vars.AEGIS_BUILD_RUNNERS_READY }}
        run: |
          if [ "$RUNNERS_READY" != true ]; then
            echo '::error::三平台专用构建机尚未确认就绪，请按 docs/github-upstream-ci.zh-CN.md 接入。'
            exit 1
          fi
      - name: 获取本次官方版本证据
        run: python apps/browser/scripts/check-chromium-upstream.py --output ci-evidence/upstream
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-upstream
          path: ci-evidence/upstream
          if-no-files-found: error
  build:
    if: ${{ !inputs.windows_hosted_trial }}
    needs: preflight
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            labels: '["self-hosted", "macOS", "ARM64", "aegis-upstream"]'
          - platform: windows
            labels: '["self-hosted", "Windows", "X64", "aegis-upstream"]'
          - platform: android
            labels: '["self-hosted", "Linux", "X64", "aegis-upstream"]'
    runs-on: ${{ fromJSON(matrix.labels) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: false
      - uses: actions/download-artifact@v4
        with:
          name: candidate-upstream
          path: ci-evidence/upstream
      - name: 核对源码、构建、测试及验收
        # 专用机器预装 Python 3.12+；配置由机器环境 AEGIS_CI_CONFIG 指定。
        run: python apps/browser/scripts/ci/candidate.py build --platform ${{ matrix.platform }} --evidence ci-evidence
      - name: 记录平台结果
        if: always()
        run: python apps/browser/scripts/ci/candidate.py summary --evidence ci-evidence
      - name: 保存产物和失败现场
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence
          if-no-files-found: error
          retention-days: 14
  summary:
    needs: [preflight, build]
    if: ${{ always() && !inputs.windows_hosted_trial }}
    runs-on: ubuntu-latest
    steps:
      - name: 三平台完成状态
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          BUILDS: ${{ needs.build.result }}
        run: |
          echo "前置检查：$PREFLIGHT；三平台构建与配置的验收：$BUILDS" >> "$GITHUB_STEP_SUMMARY"
          echo '安装包、运行验收、漏洞回归和正式发布是独立状态；本流程不发布 Release 或替换用户 App。' >> "$GITHUB_STEP_SUMMARY"
          test "$PREFLIGHT" = success && test "$BUILDS" = success

  windows-trial-preflight:
    if: ${{ inputs.windows_hosted_trial && github.repository == 'gcsagroup/aegis-browser' && github.run_attempt == 1 }}
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: 保持补丁与覆盖文件原始字节
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: 在免费 Windows 机器验证编排与失败边界
        run: python -m unittest discover -s apps/browser/scripts/ci -p '*_test.py'
      - name: 实际初始化并验证 Windows Git、Python、gclient 与 C++ 入口
        run: python apps/browser/scripts/ci/windows_hosted.py --preflight-only --work "${{ runner.temp }}\aegis-tools" --evidence ci-evidence/windows-toolchain
      - name: 保存入口验收与初始化日志
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-toolchain-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/windows-toolchain
          if-no-files-found: warn
          retention-days: 7

  windows-hosted-trial:
    needs: windows-trial-preflight
    if: ${{ inputs.windows_hosted_trial && github.repository == 'gcsagroup/aegis-browser' && github.run_attempt == 1 }}
    runs-on: aegis-windows-32
    timeout-minutes: 240
    steps:
      - name: 保持补丁与覆盖文件原始字节
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: 核对工具链并选择临时构建盘
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -version '[18.0,19.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 Microsoft.VisualStudio.Component.VC.ATLMFC -property installationPath
          if (-not $vs) { throw '缺少 VS2026 C++ 与 ATL/MFC 工具链' }
          "GYP_MSVS_OVERRIDE_PATH=$vs" >> $env:GITHUB_ENV
          "vs2026_install=$vs" >> $env:GITHUB_ENV
          $disk = Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free -gt 300GB -and $_.Root -match '^[A-Z]:\\$' } | Sort-Object Free -Descending | Select-Object -First 1
          if (-not $disk) { throw '没有满足 300 GiB 可用空间门槛的构建盘' }
          "AEGIS_HOSTED_WORK=$($disk.Root)aegis" >> $env:GITHUB_ENV
      - name: 固定源码、完整构建并运行原生测试
        timeout-minutes: 220
        shell: pwsh
        run: python apps/browser/scripts/ci/windows_hosted.py --work "$env:AEGIS_HOSTED_WORK" --evidence ci-evidence/windows-hosted
      - name: 保存本次产物、源码身份及失败日志
        if: ${{ always() }}
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-hosted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/windows-hosted
          if-no-files-found: warn
          retention-days: 1
