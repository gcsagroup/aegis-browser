name: Platform CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: ${{ github.event_name != 'pull_request' || toJSON(github.event.pull_request.draft) == 'false' }}
    name: platform-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.route.outputs.required }}
      rules: ${{ steps.route.outputs.rules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Plan using the checked merge parents and trusted rules
        id: route
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          ROUTE_PUSH_BEFORE: ${{ github.event.before }}
          CI_PLATFORM_OBSERVATION: 'true'
          CI_LIGHTWEIGHT_ADMITTED: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop' && vars.AEGIS_SELF_HOSTED_TEST_REPOSITORY != '' && github.repository == vars.AEGIS_SELF_HOSTED_TEST_REPOSITORY && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rules="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            read -r rules head extra <<< "$(git show -s --format=%P HEAD)"
            test -n "$rules" && test -n "$head" && test -z "$extra"
            test "$head" = "$PR_HEAD"
            git merge-base --is-ancestor "$PR_BASE" "$rules"
          fi
          if ! git cat-file -e "$rules:scripts/ci/check-platform-gate.mjs"; then
            echo "::error::The trusted base predates platform-gate. Observe it after the routing policy lands."
            exit 1
          fi
          git show "$rules:scripts/ci/platform-impact.mjs" > "$RUNNER_TEMP/platform-impact.mjs"
          git show "$rules:scripts/ci/check-platform-gate.mjs" > "$RUNNER_TEMP/check-platform-gate.mjs"
          GITHUB_OUTPUT= node "$RUNNER_TEMP/platform-impact.mjs" > "$RUNNER_TEMP/platform-plan.json"
          required="$(node "$RUNNER_TEMP/check-platform-gate.mjs" plan "$GITHUB_SHA" "$rules" < "$RUNNER_TEMP/platform-plan.json")"
          test -n "$required"
          printf 'required=%s\n' "$required" >> "$GITHUB_OUTPUT"
          printf 'rules=%s\n' "$rules" >> "$GITHUB_OUTPUT"
      - name: Upload platform routing evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: platform-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-plan.json
          if-no-files-found: error
          retention-days: 14

  android:
    needs: plan
    if: ${{ needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.required), 'android') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.11.9
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9.15.0
          run_install: false
      - name: Install locked dependencies for workflow contracts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run Android host, pin and release regressions
        run: |
          node --test apps/browser/scripts/verify-android-agent-target_test.mjs apps/browser/scripts/android-agent-ui_test.mjs
          bash apps/browser/scripts/package-android-guards_test.sh
          bash -n apps/browser/scripts/package-android.sh
          python3 -B scripts/ci/check-android-platform-inputs.py
          python3 -B apps/browser/scripts/ci/candidate_test.py
          python3 -B apps/browser/scripts/release-contract_test.py
          python3 -B scripts/ci/run-android-release-tests.py
          node --test scripts/ci/tests/android-*.test.mjs

  ios:
    needs: plan
    if: ${{ needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.required), 'ios') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.11.9
      - uses: ./.github/actions/ensure-ios-ruby
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9.15.0
          run_install: false
      - name: Install locked dependencies for workflow contracts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run iOS release and WebExtension contracts
        run: |
          bundle exec ruby -e 'Dir["fastlane/tests/*_test.rb"].sort.each { |p| require_relative p }'
          python3 -B -m unittest discover -s scripts/release -p 'test_ios*.py'
          PYTHONPATH=scripts/release python3 -B -m unittest \
            scripts/release/test_verify_ios_archive.py scripts/release/test_verify_signed_ios.py \
            scripts/release/test_verify_ios_dsyms.py scripts/release/test_development_signing.py \
            scripts/release/test_development_key_access.py scripts/release/test_verify_ipa.py \
            scripts/release/test_hosted_signing.py scripts/release/test_cloud_archive.py \
            scripts/release/test_native_signing_session.py scripts/release/test_artifact_transport.py \
            scripts/release/test_product_delivery.py scripts/release/test_private_alpha_inputs.py
          node apps/ios/scripts/generate-tracker-rules.mjs --check
          node --test apps/ios/Tests/SharedWebExtension/SafariNavigationIdentityTests.mjs
          node --test scripts/ci/tests/ios-*.test.mjs

  macos:
    needs: plan
    if: ${{ needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.required), 'macos') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.11.9
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9.15.0
          run_install: false
      - name: Install locked dependencies for workflow contracts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install the standalone C++ test toolchain
        run: sudo apt-get update && sudo apt-get install -y libstdc++-14-dev clang
      - name: Run standalone Access and DMG contracts
        run: |
          python3 -B apps/browser/scripts/ci/candidate_test.py
          python3 -B -m unittest scripts/release/test_macos_dmg.py scripts/release/test_macos_dmg_delivery.py scripts/release/test_macos_developer_id.py
          python3 -B apps/browser/scripts/release-contract_test.py
          node --test scripts/ci/tests/macos-*.test.mjs
          bash scripts/release/macos-access-tests.sh

  linux:
    needs: plan
    if: ${{ needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.required), 'linux') }}
    uses: ./.github/workflows/other-platform-coverage.yml
    with:
      lane: linux

  windows:
    needs: plan
    if: ${{ needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.required), 'windows') }}
    uses: ./.github/workflows/other-platform-coverage.yml
    with:
      lane: windows

  platform-summary:
    name: ${{ (github.event_name != 'pull_request' || toJSON(github.event.pull_request.draft) == 'false') && 'platform-gate' || 'platform-deferred-draft-or-missing-metadata' }}
    if: ${{ always() && (github.event_name != 'pull_request' || toJSON(github.event.pull_request.draft) == 'false') }}
    needs: [plan, android, ios, linux, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Validate selected job outcomes with the trusted gate
        shell: bash
        env:
          RULES_SHA: ${{ needs.plan.outputs.rules }}
          PLATFORM_REQUIRED: ${{ needs.plan.outputs.required }}
          PLATFORM_NEEDS: ${{ toJSON(needs) }}
        run: |
          if [[ ! "$RULES_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::No trusted platform plan completed"
            exit 1
          fi
          git show "$RULES_SHA:scripts/ci/check-platform-gate.mjs" > "$RUNNER_TEMP/check-platform-gate.mjs"
          node "$RUNNER_TEMP/check-platform-gate.mjs" results | tee -a "$GITHUB_STEP_SUMMARY"
