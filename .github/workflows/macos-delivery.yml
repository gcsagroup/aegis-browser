name: macOS Delivery
run-name: macOS Delivery ${{ inputs.operation || 'contracts' }} ${{ inputs.version || github.ref_name }}
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - promote/ios-access-closed-loop-2cd7
  workflow_dispatch:
    inputs:
      operation:
        description: "Access tests, a known .app DMG, a searched DMG, or a rebuilt ad-hoc DMG"
        type: choice
        options:
          - Access tests
          - Package DMG
          - Internal DMG
          - Rebuild DMG
        default: Access tests
      version:
        description: "Product version, for example 6.1.0.266"
        type: string
        required: true
      signing_mode:
        description: "Ignored for Access tests. Package DMG stays unnotarized."
        type: choice
        options: [ad-hoc, developer-id]
        default: ad-hoc
      arch:
        description: "DMG architecture. Must match the self-hosted Mac."
        type: choice
        options: [arm64]
        default: arm64
      app_path:
        description: "Absolute .app path on the runner. Required for Package DMG."
        type: string
        default: ""
      product_checkout:
        description: "Existing-app packaging only: product checkout on the runner; blank uses the workflow checkout."
        type: string
        default: ""
      product_sha:
        description: "Existing-app packaging only: full product SHA; blank uses the workflow SHA. Rebuild uses the workflow checkout."
        type: string
        default: ""
permissions:
  contents: read
  actions: read
concurrency:
  group: macos-delivery-${{ github.repository }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  contracts:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Install a C++ standard library for the Access native unit
        run: sudo apt-get update && sudo apt-get install -y libstdc++-14-dev clang
      - name: Access tests and unnotarized DMG contracts
        run: |
          python3 -B -m unittest scripts/release/test_macos_dmg.py scripts/release/test_macos_developer_id.py
          bash scripts/release/macos-access-tests.sh
  admission:
    if: ${{ github.event_name == 'workflow_dispatch' && (github.repository == 'quinn521/aegis-browser' || github.repository == 'gcsagroup/aegis-browser') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      operation: ${{ steps.plan.outputs.operation }}
      runner: ${{ steps.plan.outputs.runner }}
      signing_mode: ${{ steps.plan.outputs.signing_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Require repository Admin
        run: node scripts/ci/macos-operator.mjs --context delivery
        env:
          GH_TOKEN: ${{ github.token }}
      - id: plan
        name: Plan Access tests or unnotarized DMG
        env:
          MACOS_OPERATION: ${{ inputs.operation == 'Package DMG' && 'package' || 'access' }}
          MACOS_VERSION: ${{ inputs.version }}
          MACOS_SIGNING_MODE: ${{ inputs.signing_mode }}
          MACOS_ARCH: ${{ inputs.arch }}
          MACOS_APP_PATH: ${{ inputs.operation == 'Package DMG' && inputs.app_path || '' }}
          MACOS_NOTARIZE: "false"
          AEGIS_MACOS_RUNNER_LABEL: ${{ vars.AEGIS_MACOS_RUNNER_LABEL }}
          AEGIS_IOS_RUNNER_LABEL: ${{ vars.AEGIS_IOS_RUNNER_LABEL }}
          AEGIS_MACOS_APP_ROOT: ${{ vars.AEGIS_MACOS_APP_ROOT }}
          AEGIS_MACOS_DEVELOPER_ID: ${{ vars.AEGIS_MACOS_DEVELOPER_ID }}
        run: python3 scripts/release/macos-dmg.py plan
  access-tests:
    name: access-tests
    needs: admission
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation != 'Rebuild DMG' }}
    runs-on: ${{ fromJSON(needs.admission.outputs.runner) }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Run Access tests on the self-hosted Mac
        run: bash scripts/release/macos-access-tests.sh
  package:
    name: package-dmg
    needs:
      - admission
      - access-tests
    if: ${{ github.event_name == 'workflow_dispatch' && needs.admission.outputs.operation == 'package' }}
    runs-on: ${{ fromJSON(needs.admission.outputs.runner) }}
    timeout-minutes: 40
    env:
      MACOS_OPERATION: package
      MACOS_VERSION: ${{ inputs.version }}
      MACOS_SIGNING_MODE: ${{ inputs.signing_mode }}
      MACOS_ARCH: ${{ inputs.arch }}
      MACOS_APP_PATH: ${{ inputs.app_path }}
      MACOS_PRODUCT_CHECKOUT: ${{ inputs.product_checkout }}
      MACOS_EXPECTED_SOURCE_SHA: ${{ inputs.product_sha }}
      MACOS_NOTARIZE: "false"
      AEGIS_MACOS_RUNNER_LABEL: ${{ vars.AEGIS_MACOS_RUNNER_LABEL }}
      AEGIS_IOS_RUNNER_LABEL: ${{ vars.AEGIS_IOS_RUNNER_LABEL }}
      AEGIS_MACOS_APP_ROOT: ${{ vars.AEGIS_MACOS_APP_ROOT }}
      AEGIS_MACOS_DEVELOPER_ID: ${{ vars.AEGIS_MACOS_DEVELOPER_ID }}
      AEGIS_APPLE_TEAM_ID: ${{ vars.AEGIS_APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: identity
        name: Import Developer ID into a job-local keychain
        if: ${{ inputs.signing_mode == 'developer-id' }}
        env:
          AEGIS_MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.AEGIS_MACOS_DEVELOPER_ID_P12_BASE64 }}
          AEGIS_MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.AEGIS_MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: python3 scripts/release/macos-developer-id.py setup
      - name: Sign and write the unnotarized DMG
        env:
          AEGIS_MACOS_DEVELOPER_ID: ${{ inputs.signing_mode == 'developer-id' && steps.identity.outputs.identity || vars.AEGIS_MACOS_DEVELOPER_ID }}
          AEGIS_MACOS_SIGNING_KEYCHAIN: ${{ steps.identity.outputs.keychain }}
        run: |
          export MACOS_ACTUAL_ARCH="$(uname -m)"
          export MACOS_OUTPUT_DIR="${RUNNER_TEMP}/aegis-macos-dmg-${GITHUB_RUN_ID}"
          python3 scripts/release/macos-dmg.py package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() && inputs.signing_mode != '' }}
        with:
          name: macos-dmg-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aegis-macos-dmg-${{ github.run_id }}/*.dmg
            ${{ runner.temp }}/aegis-macos-dmg-${{ github.run_id }}/macos-delivery-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove the job-local Developer ID keychain
        if: ${{ always() && inputs.signing_mode == 'developer-id' }}
        run: python3 scripts/release/macos-developer-id.py cleanup
  internal-dmg:
    name: internal-dmg
    needs:
      - admission
      - access-tests
    if: ${{ always() && github.event_name == 'workflow_dispatch' && (inputs.operation == 'Internal DMG' || inputs.operation == 'Rebuild DMG') && needs.admission.result == 'success' && (needs.access-tests.result == 'success' || (inputs.operation == 'Rebuild DMG' && needs.access-tests.result == 'skipped')) }}
    runs-on: ${{ fromJSON(needs.admission.outputs.runner) }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Package the searched app as an unnotarized internal DMG
        if: ${{ inputs.operation == 'Internal DMG' }}
        env:
          MACOS_PRODUCT_CHECKOUT: ${{ inputs.product_checkout }}
          MACOS_EXPECTED_SOURCE_SHA: ${{ inputs.product_sha }}
          AEGIS_MACOS_APP_ROOT: ${{ vars.AEGIS_MACOS_APP_ROOT }}
          AEGIS_IOS_RUNNER_LABEL: ${{ vars.AEGIS_IOS_RUNNER_LABEL }}
          MACOS_SIGNING_MODE: ad-hoc
          MACOS_OUTPUT_DIR: ${{ runner.temp }}/aegis-macos-internal-${{ inputs.version }}
        run: bash scripts/release/macos-internal-dmg.sh "${{ inputs.version }}" "${{ inputs.arch }}"
      - name: Rebuild GCSA Aegis.app and ad-hoc sign the DMG
        if: ${{ inputs.operation == 'Rebuild DMG' }}
        env:
          AEGIS_IOS_RUNNER_LABEL: ${{ vars.AEGIS_IOS_RUNNER_LABEL }}
          MACOS_SIGNING_MODE: ad-hoc
          MACOS_OUTPUT_DIR: ${{ runner.temp }}/aegis-macos-internal-${{ inputs.version }}
        run: bash scripts/release/macos-rebuild-dmg.sh "${{ inputs.version }}" "${{ inputs.arch }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: macos-internal-${{ inputs.version }}-${{ inputs.arch }}
          path: |
            ${{ runner.temp }}/aegis-macos-internal-${{ inputs.version }}/*.dmg
            ${{ runner.temp }}/aegis-macos-internal-${{ inputs.version }}/macos-delivery-receipt.json
          if-no-files-found: error
          retention-days: 14
