name: iOS Clear Empty Upload
run-name: iOS Clear Empty Upload ${{ inputs.version }}(${{ inputs.build }})
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.1)"
        type: string
        required: true
      build:
        description: "Build with empty AWAITING_UPLOAD only"
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: ios-clear-empty-upload-${{ github.repository }}
  cancel-in-progress: false
jobs:
  clear:
    if: ${{ github.repository == 'gcsagroup/aegis-browser' }}
    runs-on: ubuntu-24.04
    environment: aegis-ios-store
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BUILD: ${{ inputs.build }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Require repository Admin
        run: node scripts/ci/ios-operator.mjs --context delivery
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: 3.3.6
          bundler-cache: true
      - name: Recheck Admin and current source before loading ASC credentials
        run: node scripts/ci/ios-release-preflight.mjs --sha "$GITHUB_SHA"
      - name: Delete empty AWAITING_UPLOAD reservation only
        env:
          AEGIS_ASC_KEY_ID: ${{ secrets.AEGIS_ASC_KEY_ID }}
          AEGIS_ASC_ISSUER_ID: ${{ secrets.AEGIS_ASC_ISSUER_ID }}
          AEGIS_ASC_KEY_BASE64: ${{ secrets.AEGIS_ASC_KEY_BASE64 }}
        run: bundle exec ruby scripts/release/clear-empty-build-upload.rb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-clear-empty-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ios-status/clear-empty-upload.json
          if-no-files-found: error
          retention-days: 30
