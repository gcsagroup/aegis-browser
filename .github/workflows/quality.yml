name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact ancestor SHA used as the trusted comparison base
        required: true
        type: string
      target_sha:
        description: Exact SHA selected on main for this diagnostic run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && 'main' || format('dispatch-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9.15.0
          run_install: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.11.9
      - name: Install fixed ripgrep
        timeout-minutes: 5
        run: bash scripts/ci/install-ripgrep.sh
      - name: Run full quality gate
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || inputs.base_sha }}
          CI_EVENT: ${{ github.event_name }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'push' && github.sha || inputs.target_sha }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_REF: ${{ github.ref }}
          CI_TESTED_SHA: ${{ github.sha }}
          REPORT_DIR: .artifacts/ci/github-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/ci/run-quality.mjs --scope full --base "$CI_BASE_SHA" --report-dir "$REPORT_DIR"
      - name: Upload quality evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ci/github-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

  quality-gate:
    name: quality-gate
    if: ${{ always() }}
    needs:
      - quality
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Check out gate implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require every mandatory job to succeed
        env:
          REQUIRED_RESULTS: '{"quality":"${{ needs.quality.result }}"}'
        run: node scripts/ci/check-required-results.mjs
