name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - releases/ios/1.0
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact ancestor SHA used as the trusted comparison base
        required: true
        type: string
      target_sha:
        description: Exact SHA selected on an admitted quality branch for this diagnostic run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('push-{0}-{1}', github.ref, github.sha) || format('dispatch-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  impact:
    if: ${{ github.event_name != 'pull_request' || toJSON(github.event.pull_request.draft) == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    name: quality-impact
    outputs:
      docs: ${{ steps.impact.outputs.docs }}
      android: ${{ steps.impact.outputs.android }}
      windows: ${{ steps.impact.outputs.windows }}
      linux: ${{ steps.impact.outputs.linux }}
      integrate: ${{ steps.impact.outputs.integrate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Plan quality checks using target-branch rules
        id: impact
        env:
          CI_LIGHTWEIGHT_ADMITTED: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop' && vars.AEGIS_SELF_HOSTED_TEST_REPOSITORY != '' && github.repository == vars.AEGIS_SELF_HOSTED_TEST_REPOSITORY && github.event.pull_request.head.repo.full_name == github.repository }}
          ROUTE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ROUTE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          ROUTE_PUSH_BEFORE: ${{ github.event.before }}
          ROUTE_DEFAULT_MISSING_DOCS: 'false'
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            parents="$(git show -s --format=%P HEAD)"
            read -r base head extra <<< "$parents"
            test -n "$base" && test -n "$head" && test -z "$extra"
            test "$head" = "$ROUTE_HEAD_SHA"
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            git merge-base --is-ancestor "$ROUTE_BASE_SHA" "$base"
            ROUTE_BASE_SHA="$base"
          fi
          git diff --raw --no-abbrev --no-renames -z "$ROUTE_BASE_SHA" HEAD > "$RUNNER_TEMP/docs-complete-diff"
          mkdir -p .artifacts/ci
          if git cat-file -e "$ROUTE_BASE_SHA:scripts/ci/platform-impact.mjs"; then
            git show "$ROUTE_BASE_SHA:scripts/ci/platform-impact.mjs" > "$RUNNER_TEMP/platform-impact.mjs"
            node "$RUNNER_TEMP/platform-impact.mjs" > .artifacts/ci/docs-impact.json
          else
            echo '{"docs":false,"reason":"trusted-baseline-predates-router"}' > .artifacts/ci/docs-impact.json
          fi
          # Fill missing keys from the trusted base. Never run the helper checked out with the candidate.
          if git cat-file -e "$ROUTE_BASE_SHA:scripts/ci/fill-platform-route-defaults.mjs"; then
            git show "$ROUTE_BASE_SHA:scripts/ci/fill-platform-route-defaults.mjs" > "$RUNNER_TEMP/fill-platform-route-defaults.mjs"
          else
            cat > "$RUNNER_TEMP/fill-platform-route-defaults.mjs" <<'EOF'
          #!/usr/bin/env node
          import {appendFileSync, readFileSync, writeFileSync} from 'node:fs';
          
          // Fill keys an older trusted-base router did not print. A value that is already
          // printed stays, including an explicit false. New platforms default off so an
          // old router cannot fan a change out onto Android, Windows or Linux.
          const outputPath = process.env.GITHUB_OUTPUT;
          const planPath = process.argv[2];
          if (!outputPath || !planPath) throw new Error('GITHUB_OUTPUT and plan path required');
          // eslint-disable-next-line security/detect-non-literal-fs-filename -- The runner supplies its own output file and the workflow names the plan artifact.
          const output = readFileSync(outputPath, 'utf8');
          // eslint-disable-next-line security/detect-non-literal-fs-filename -- The plan path is the artifact written by this same job.
          const plan = JSON.parse(readFileSync(planPath, 'utf8'));
          const printed = new Map();
          for (const line of output.split('\n')) {
            const eq = line.indexOf('=');
            if (eq > 0) printed.set(line.slice(0, eq), line.slice(eq + 1));
          }
          const additions = [];
          const remember = (key, value) => {
            additions.push(`${key}=${value}`);
            if (key === 'docs') plan.docs = value;
            else if (key === 'ios') plan.ios = value;
            else if (key === 'android') plan.android = value;
            else if (key === 'macos') plan.macos = value;
            else if (key === 'windows') plan.windows = value;
            else if (key === 'linux') plan.linux = value;
            else if (key === 'integrate') plan.integrate = value;
            else if (key === 'deep') plan.deep = value;
          };
          const current = key => {
            if (printed.has(key)) return printed.get(key) === 'true';
            if (key === 'docs') return plan.docs === true;
            if (key === 'ios') return plan.ios === true;
            if (key === 'android') return plan.android === true;
            if (key === 'macos') return plan.macos === true;
            if (key === 'windows') return plan.windows === true;
            if (key === 'linux') return plan.linux === true;
            if (key === 'integrate') return plan.integrate === true;
            return plan.deep === true;
          };
          const apply = (key, value) => {
            if (printed.has(key)) return;
            printed.set(key, String(value));
            remember(key, value);
          };
          const iosDefault = process.env.ROUTE_DEFAULT_MISSING_IOS;
          const macosDefault = process.env.ROUTE_DEFAULT_MISSING_MACOS;
          const docsDefault = process.env.ROUTE_DEFAULT_MISSING_DOCS;
          if (iosDefault === 'true' || iosDefault === 'false') apply('ios', iosDefault === 'true');
          if (macosDefault === 'true' || macosDefault === 'false') apply('macos', macosDefault === 'true');
          if (docsDefault === 'true' || docsDefault === 'false') apply('docs', docsDefault === 'true');
          apply('android', false);
          apply('windows', false);
          apply('linux', false);
          const opened = current('ios') || current('macos');
          apply('integrate', opened);
          apply('deep', opened);
          if (additions.length === 0) process.exit(0);
          // eslint-disable-next-line security/detect-non-literal-fs-filename -- Same runner-owned output file as the read above.
          appendFileSync(outputPath, `${output.endsWith('\n') || output.length === 0 ? '' : '\n'}${additions.join('\n')}\n`);
          plan.platformReason = 'missing-platform-rule-default';
          // eslint-disable-next-line security/detect-non-literal-fs-filename -- Same workflow-owned plan artifact as the read above.
          writeFileSync(planPath, `${JSON.stringify(plan, null, 2)}\n`);
          EOF
          fi
          node "$RUNNER_TEMP/fill-platform-route-defaults.mjs" .artifacts/ci/docs-impact.json
      - name: Upload quality routing evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docs-impact-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ci/docs-impact.json
          if-no-files-found: error
          retention-days: 14
  quality:
    needs: impact
    name: quality
    if: ${{ github.event_name != 'pull_request' || toJSON(github.event.pull_request.draft) == 'false' }}
    runs-on: >-
      ${{ needs.impact.outputs.docs == 'true' && 'ubuntu-24.04' || (vars.AEGIS_SELF_HOSTED_TEST_REPOSITORY != '' && github.repository == vars.AEGIS_SELF_HOSTED_TEST_REPOSITORY && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && fromJSON('["self-hosted", "macOS", "ARM64", "aegis-test"]') || 'macos-15') }}
    timeout-minutes: 40
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # pull_request.base.sha can lag the merge ref's first parent when the PR is
      # behind main; ci-identity requires B/H to be the exact merge parents.
      - name: Resolve pull request merge base tip
        id: merge_base
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          parents="$(git rev-list --parents -n 1 HEAD)"
          test "$(printf '%s\n' "$parents" | awk '{print NF}')" -eq 3
          base="$(printf '%s\n' "$parents" | awk '{print $2}')"
          head="$(printf '%s\n' "$parents" | awk '{print $3}')"
          test -n "$base" && test -n "$head"
          printf 'sha=%s\n' "$base" >> "$GITHUB_OUTPUT"
      - name: Resolve push base
        id: push_base
        if: ${{ github.event_name == 'push' }}
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PUSH_BEFORE"
          if [[ "$base" == '0000000000000000000000000000000000000000' && "$GITHUB_REF" == refs/heads/releases/ios/* ]]; then
            base="$(git merge-base HEAD refs/remotes/origin/main)"
          fi
          git rev-parse --verify "${base}^{commit}" >/dev/null
          printf 'sha=%s\n' "$base" >> "$GITHUB_OUTPUT"
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Install pnpm
        if: ${{ needs.impact.outputs.docs != 'true' }}
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9.15.0
          dest: ${{ runner.temp }}/setup-pnpm
          run_install: false
      - name: Install Python
        if: ${{ needs.impact.outputs.docs != 'true' && runner.environment != 'self-hosted' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.11.9
      - name: Verify preinstalled Python on self-hosted runner
        if: ${{ needs.impact.outputs.docs != 'true' && runner.environment == 'self-hosted' }}
        run: python3 -c 'import sys; assert sys.version_info[:3] == (3, 11, 9), sys.version; print(sys.version)'
      - name: Install fixed ripgrep
        if: ${{ needs.impact.outputs.docs != 'true' }}
        timeout-minutes: 5
        run: bash scripts/ci/install-ripgrep.sh
      - name: Run full quality gate
        if: ${{ needs.impact.outputs.docs != 'true' }}
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && steps.merge_base.outputs.sha || github.event_name == 'push' && steps.push_base.outputs.sha || inputs.base_sha }}
          CI_EVENT: ${{ github.event_name }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'push' && github.sha || inputs.target_sha }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_REF: ${{ github.ref }}
          CI_TESTED_SHA: ${{ github.sha }}
          REPORT_DIR: .artifacts/ci/github-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/ci/run-quality.mjs --scope full --base "$CI_BASE_SHA" --report-dir "$REPORT_DIR"
      - name: Run documentation quality gate
        if: ${{ needs.impact.outputs.docs == 'true' }}
        env:
          REPORT_DIR: .artifacts/ci/github-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$REPORT_DIR"
          node scripts/check-repo-contracts.mjs > "$REPORT_DIR/docs-contracts.log" 2>&1
          cat "$REPORT_DIR/docs-contracts.log"
      - name: Upload quality evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ci/github-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

  other-platforms:
    name: other-platforms
    continue-on-error: true
    needs:
      - impact
      - quality
    if: ${{ (github.event_name != 'pull_request' || toJSON(github.event.pull_request.draft) == 'false') && needs.quality.result == 'success' && needs.impact.result == 'success' && (needs.impact.outputs.android == 'true' || needs.impact.outputs.windows == 'true' || needs.impact.outputs.linux == 'true') && needs.impact.outputs.integrate == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      # Each selected suite reports its own outcome even if a peer failed.
      - name: Run Android contracts
        if: ${{ !cancelled() && steps.node.outcome == 'success' && needs.impact.outputs.android == 'true' }}
        run: corepack pnpm run quality:android
      - name: Run Windows contracts
        if: ${{ !cancelled() && steps.node.outcome == 'success' && needs.impact.outputs.windows == 'true' }}
        run: corepack pnpm run quality:windows
      - name: Run Linux shell contracts
        if: ${{ !cancelled() && steps.node.outcome == 'success' && needs.impact.outputs.linux == 'true' }}
        run: corepack pnpm run quality:linux

  quality-summary:
    name: ${{ (github.event_name != 'pull_request' || toJSON(github.event.pull_request.draft) == 'false') && 'quality-gate' || 'quality-deferred-draft-or-missing-metadata' }}
    if: ${{ always() && (github.event_name != 'pull_request' || toJSON(github.event.pull_request.draft) == 'false') }}
    needs:
      - quality
    runs-on: >-
      ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out gate implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require every mandatory job to succeed
        env:
          REQUIRED_RESULTS: '{"quality":"${{ needs.quality.result }}"}'
        run: node scripts/ci/check-required-results.mjs
