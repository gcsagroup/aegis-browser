name: iOS Release Validation
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - codex/ios-release-*
  workflow_dispatch:
    inputs:
      exercise:
        description: "Existing contracts or frozen cloud signing PoC"
        type: choice
        options: [contracts, cloud-poc]
        default: contracts
      source_sha:
        description: "Full frozen candidate SHA (cloud PoC only)"
        type: string
      version:
        description: "Cloud PoC version"
        type: string
        default: "0.8.0"
      build:
        description: "Unused cloud PoC build number"
        type: string
        default: "500"
      upload:
        description: "Upload verified cloud IPA and wait; no App Review submission"
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ios-validation-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr-or-dispatch' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_OPT_OUT_USAGE: "1"
  BUNDLE_FROZEN: "true"
jobs:
  impact:
    if: ${{ inputs.exercise != 'cloud-poc' && (github.event_name != 'pull_request' || toJSON(github.event.pull_request.draft) == 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.impact.outputs.ios }}
      integrate: ${{ steps.impact.outputs.integrate }}
      deep: ${{ steps.impact.outputs.deep }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Plan iOS checks using target-branch rules
        id: impact
        env:
          ROUTE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ROUTE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          ROUTE_PUSH_BEFORE: ${{ github.event.before }}
          ROUTE_DEFAULT_MISSING_IOS: 'true'
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            parents="$(git show -s --format=%P HEAD)"
            read -r base head extra <<< "$parents"
            test -n "$base" && test -n "$head" && test -z "$extra"
            test "$head" = "$ROUTE_HEAD_SHA"
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            git merge-base --is-ancestor "$ROUTE_BASE_SHA" "$base"
            ROUTE_BASE_SHA="$base"
          fi
          git diff --raw --no-abbrev --no-renames -z "$ROUTE_BASE_SHA" HEAD > "$RUNNER_TEMP/ios-complete-diff"
          mkdir -p .artifacts/ci
          if git cat-file -e "$ROUTE_BASE_SHA:scripts/ci/platform-impact.mjs"; then
            git show "$ROUTE_BASE_SHA:scripts/ci/platform-impact.mjs" > "$RUNNER_TEMP/platform-impact.mjs"
            node "$RUNNER_TEMP/platform-impact.mjs" > .artifacts/ci/ios-impact.json
          else
            echo '{"ios":true,"reason":"trusted-baseline-predates-router"}' > .artifacts/ci/ios-impact.json
          fi
          # Fill missing keys from the trusted base. Never run the helper checked out with the candidate.
          if git cat-file -e "$ROUTE_BASE_SHA:scripts/ci/fill-platform-route-defaults.mjs"; then
            git show "$ROUTE_BASE_SHA:scripts/ci/fill-platform-route-defaults.mjs" > "$RUNNER_TEMP/fill-platform-route-defaults.mjs"
          else
            cat > "$RUNNER_TEMP/fill-platform-route-defaults.mjs" <<'EOF'
          #!/usr/bin/env node
          import {appendFileSync, readFileSync, writeFileSync} from 'node:fs';
          
          // Fill keys an older trusted-base router did not print. A value that is already
          // printed stays, including an explicit false. New platforms default off so an
          // old router cannot fan a change out onto Android, Windows or Linux.
          const outputPath = process.env.GITHUB_OUTPUT;
          const planPath = process.argv[2];
          if (!outputPath || !planPath) throw new Error('GITHUB_OUTPUT and plan path required');
          // eslint-disable-next-line security/detect-non-literal-fs-filename -- The runner supplies its own output file and the workflow names the plan artifact.
          const output = readFileSync(outputPath, 'utf8');
          // eslint-disable-next-line security/detect-non-literal-fs-filename -- The plan path is the artifact written by this same job.
          const plan = JSON.parse(readFileSync(planPath, 'utf8'));
          const printed = new Map();
          for (const line of output.split('\n')) {
            const eq = line.indexOf('=');
            if (eq > 0) printed.set(line.slice(0, eq), line.slice(eq + 1));
          }
          const additions = [];
          const remember = (key, value) => {
            additions.push(`${key}=${value}`);
            if (key === 'docs') plan.docs = value;
            else if (key === 'ios') plan.ios = value;
            else if (key === 'android') plan.android = value;
            else if (key === 'macos') plan.macos = value;
            else if (key === 'windows') plan.windows = value;
            else if (key === 'linux') plan.linux = value;
            else if (key === 'integrate') plan.integrate = value;
            else if (key === 'deep') plan.deep = value;
          };
          const current = key => {
            if (printed.has(key)) return printed.get(key) === 'true';
            if (key === 'docs') return plan.docs === true;
            if (key === 'ios') return plan.ios === true;
            if (key === 'android') return plan.android === true;
            if (key === 'macos') return plan.macos === true;
            if (key === 'windows') return plan.windows === true;
            if (key === 'linux') return plan.linux === true;
            if (key === 'integrate') return plan.integrate === true;
            return plan.deep === true;
          };
          const apply = (key, value) => {
            if (printed.has(key)) return;
            printed.set(key, String(value));
            remember(key, value);
          };
          const iosDefault = process.env.ROUTE_DEFAULT_MISSING_IOS;
          const macosDefault = process.env.ROUTE_DEFAULT_MISSING_MACOS;
          const docsDefault = process.env.ROUTE_DEFAULT_MISSING_DOCS;
          if (iosDefault === 'true' || iosDefault === 'false') apply('ios', iosDefault === 'true');
          if (macosDefault === 'true' || macosDefault === 'false') apply('macos', macosDefault === 'true');
          if (docsDefault === 'true' || docsDefault === 'false') apply('docs', docsDefault === 'true');
          apply('android', false);
          apply('windows', false);
          apply('linux', false);
          const opened = current('ios') || current('macos');
          apply('integrate', opened);
          apply('deep', opened);
          if (additions.length === 0) process.exit(0);
          // eslint-disable-next-line security/detect-non-literal-fs-filename -- Same runner-owned output file as the read above.
          appendFileSync(outputPath, `${output.endsWith('\n') || output.length === 0 ? '' : '\n'}${additions.join('\n')}\n`);
          plan.platformReason = 'missing-platform-rule-default';
          // eslint-disable-next-line security/detect-non-literal-fs-filename -- Same workflow-owned plan artifact as the read above.
          writeFileSync(planPath, `${JSON.stringify(plan, null, 2)}\n`);
          EOF
          fi
          node "$RUNNER_TEMP/fill-platform-route-defaults.mjs" .artifacts/ci/ios-impact.json
      - name: Check documentation consumers
        run: node scripts/check-repo-contracts.mjs
      - name: Require repository Admin for manual operation
        run: node scripts/ci/ios-operator.mjs --context validation
        env:
          GH_TOKEN: ${{ github.token }}
        if: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Upload iOS routing evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-impact-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ci/ios-impact.json
          if-no-files-found: error
          retention-days: 14
  contracts:
    needs: impact
    if: ${{ inputs.exercise != 'cloud-poc' && (github.event_name != 'pull_request' || toJSON(github.event.pull_request.draft) == 'false') && needs.impact.result == 'success' && (github.event_name == 'workflow_dispatch' || (needs.impact.outputs.ios == 'true' && needs.impact.outputs.integrate == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Require repository Admin for manual operation
        run: node scripts/ci/ios-operator.mjs --context validation
        env:
          GH_TOKEN: ${{ github.token }}
        if: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Verify installation-token Admin metadata capability
        run: node scripts/ci/ios-operator.mjs --probe-admin-metadata
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Ensure Ruby 3.3.6 and gems
        uses: ./.github/actions/ensure-ios-ruby
      - name: Install locked Node dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Release contracts and regressions
        run: |
          bundle exec ruby -e 'Dir["fastlane/tests/*_test.rb"].sort.each { |p| require_relative p }'
          python3 -B -m unittest discover -s scripts/release -p 'test_*.py'
          node --test scripts/ci/tests/ios-*.test.mjs
          node --test apps/ios/Tests/SharedWebExtension/SafariNavigationIdentityTests.mjs
          corepack pnpm run lint
      - name: Validate workflow syntax
        run: |
          # GitHub supports concurrency.queue; v1.7.12 predates it.
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -ignore '^unexpected key "queue" for "concurrency" section' .github/workflows/ios-*.yml
  ios-archive:
    needs:
      - impact
      - contracts
    if: ${{ inputs.exercise != 'cloud-poc' && (github.event_name != 'pull_request' || toJSON(github.event.pull_request.draft) == 'false') && needs.impact.result == 'success' && needs.contracts.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.impact.outputs.deep == 'true') }}
    runs-on: >-
      ${{ vars.AEGIS_IOS_RUNNER_LABEL != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","macOS","ARM64","{0}"]', vars.AEGIS_IOS_RUNNER_LABEL)) || 'macos-26' }}
    # Archive compile often finishes near 20m; artifact upload on the self-hosted
    # link can need another 10–15m. Keep headroom so green archives are not
    # cancelled mid-upload.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Require repository Admin for manual operation
        run: node scripts/ci/ios-operator.mjs --context validation
        env:
          GH_TOKEN: ${{ github.token }}
        if: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Verify Apple profile trust regressions without credentials
        run: python3 -B -m unittest scripts.release.test_ios_profile_trust scripts.release.test_development_signing scripts.release.test_development_key_access -v
      # Host enrollment, retained failures and evidence: docs/ci-storage.md.
      - name: Admit unsigned CI storage
        id: storage
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_RUNNER_NAME: ${{ runner.name }}
        run: python3 -I -B scripts/ci/ios-ci-storage.py prepare --runner-environment "$CI_RUNNER_ENVIRONMENT" --runner-name "$CI_RUNNER_NAME"
      # The supervised worker installs the locked Go release on both runner types.
      - name: Prepare locked EmbeddedCore XCFramework
        env:
          IOS_CI_ROOT: ${{ steps.storage.outputs.root }}
          IOS_CI_SOURCE: ${{ steps.storage.outputs.source }}
        run: |
          cd -P -- "$IOS_CI_SOURCE" 2>/dev/null || exit 1
          test "$PWD" = "$IOS_CI_SOURCE" || exit 1
          exec python3 -I -B "$IOS_CI_SOURCE/scripts/ci/ios-archive-supervisor.py" \
            --prepare-embedded-core "$BASH" "$IOS_CI_SOURCE/scripts/ci/run-ios-embedded-core-prepare.sh"
      - name: Compile uncredentialed native archive
        env:
          IOS_CI_ROOT: ${{ steps.storage.outputs.root }}
          IOS_CI_SOURCE: ${{ steps.storage.outputs.source }}
        # exec so cancellation signals the archive wrapper directly.
        run: |
          cd -P -- "$IOS_CI_SOURCE" || exit 1
          test "$PWD" = "$IOS_CI_SOURCE" || exit 1
          exec bash "$IOS_CI_SOURCE/scripts/ci/run-ios-unsigned-archive.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ success() && steps.storage.outcome == 'success' }}
        with:
          name: ios-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.storage.outputs.root }}/xcodebuild.log
            ${{ steps.storage.outputs.root }}/storage-receipt.json
            ${{ steps.storage.outputs.root }}/Aegis.xcarchive.zip
            ${{ steps.storage.outputs.root }}/unsigned-artifact.json
            ${{ steps.storage.outputs.root }}/EmbeddedCore/build-manifest.json
            ${{ steps.storage.outputs.root }}/EmbeddedCore/embedded-core-lock.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload archive diagnostics
        if: ${{ failure() && steps.storage.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-archive-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.storage.outputs.root }}/xcodebuild.log
            ${{ steps.storage.outputs.root }}/storage-receipt.json
          if-no-files-found: warn
          retention-days: 14
  cloud-poc:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.exercise == 'cloud-poc' && github.repository == 'gcsagroup/aegis-browser' }}
    runs-on: ${{ fromJSON(format('["self-hosted","macOS","ARM64","{0}"]', vars.AEGIS_IOS_RUNNER_LABEL)) }}
    environment: aegis-ios-cloud-poc
    timeout-minutes: 90
    concurrency:
      group: aegis-ios-cloud-poc
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      AEGIS_IOS_CLOUD_POC_SOURCE_SHA: ${{ vars.AEGIS_IOS_CLOUD_POC_SOURCE_SHA }}
      AEGIS_APPLE_TEAM_ID: ${{ vars.AEGIS_APPLE_TEAM_ID }}
      POC_SOURCE_SHA: ${{ inputs.source_sha }}
      POC_VERSION: ${{ inputs.version }}
      POC_BUILD: ${{ inputs.build }}
      POC_UPLOAD: ${{ inputs.upload }}
      POC_RUN_ID: hosted-${{ github.run_id }}-${{ github.run_attempt }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Admit exact frozen candidate and repository Admin
        run: node scripts/ci/ios-cloud-poc-admission.mjs
      - name: Ensure Ruby 3.3.6 and gems
        uses: ./.github/actions/ensure-ios-ruby
      - name: Check unused build before signing
        env:
          AEGIS_ASC_KEY_ID: ${{ secrets.AEGIS_ASC_KEY_ID }}
          AEGIS_ASC_ISSUER_ID: ${{ secrets.AEGIS_ASC_ISSUER_ID }}
          AEGIS_ASC_KEY_BASE64: ${{ secrets.AEGIS_ASC_KEY_BASE64 }}
        run: bundle exec fastlane ios cloud_poc_preflight
      - name: Install Go for the staged EmbeddedCore build
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache: false
      - name: Fresh archive and cloud export without Distribution P12
        env:
          AEGIS_ASC_KEY_ID: ${{ secrets.AEGIS_ASC_KEY_ID }}
          AEGIS_ASC_ISSUER_ID: ${{ secrets.AEGIS_ASC_ISSUER_ID }}
          AEGIS_ASC_KEY_BASE64: ${{ secrets.AEGIS_ASC_KEY_BASE64 }}
          AEGIS_IOS_FIREBASE_DEV_PLIST_BASE64: ${{ vars.AEGIS_IOS_FIREBASE_DEV_PLIST_BASE64 }}
        run: |
          node scripts/ci/ios-cloud-poc-admission.mjs
          python3 scripts/release/cloud-signing-poc.py --signing-mode cloud --runtime self-hosted --profile beta --version "$POC_VERSION" --build "$POC_BUILD" --team "$AEGIS_APPLE_TEAM_ID" --run-id "$POC_RUN_ID"
      - name: Upload verified IPA and wait for ASC processing without review
        if: ${{ inputs.upload }}
        env:
          AEGIS_ASC_KEY_ID: ${{ secrets.AEGIS_ASC_KEY_ID }}
          AEGIS_ASC_ISSUER_ID: ${{ secrets.AEGIS_ASC_ISSUER_ID }}
          AEGIS_ASC_KEY_BASE64: ${{ secrets.AEGIS_ASC_KEY_BASE64 }}
        run: bundle exec fastlane ios cloud_poc_upload
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: ios-cloud-poc-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/cloud-signing-poc/${{ env.POC_RUN_ID }}/*.ipa
            .artifacts/cloud-signing-poc/${{ env.POC_RUN_ID }}/*.dSYM.zip
            .artifacts/cloud-signing-poc/${{ env.POC_RUN_ID }}/*.json
            .artifacts/cloud-signing-poc/${{ env.POC_RUN_ID }}/*.log
            .artifacts/cloud-signing-state/${{ env.POC_RUN_ID }}/*.json
          if-no-files-found: error
          retention-days: 14
