name: iOS Release Validation
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    branches:
      - main
  push:
    branches:
      - main
      - codex/ios-release-*
  workflow_dispatch:
    inputs:
      exercise:
        description: "Existing contracts or frozen cloud signing PoC"
        type: choice
        options: [contracts, cloud-poc]
        default: contracts
      source_sha:
        description: "Full frozen candidate SHA (cloud PoC only)"
        type: string
      version:
        description: "Cloud PoC version"
        type: string
        default: "0.8.0"
      build:
        description: "Unused cloud PoC build number"
        type: string
        default: "500"
      upload:
        description: "Upload verified cloud IPA and wait; no App Review submission"
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ios-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_OPT_OUT_USAGE: "1"
  BUNDLE_FROZEN: "true"
jobs:
  contracts:
    if: ${{ inputs.exercise != 'cloud-poc' && (github.event_name != 'pull_request' || toJSON(github.event.pull_request.draft) == 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Require repository Admin for manual operation
        run: node scripts/ci/ios-operator.mjs --context validation
        env:
          GH_TOKEN: ${{ github.token }}
        if: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Verify installation-token Admin metadata capability
        run: node scripts/ci/ios-operator.mjs --probe-admin-metadata
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Ensure Ruby 3.3.6 and gems
        uses: ./.github/actions/ensure-ios-ruby
      - name: Install locked Node dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Release contracts and regressions
        run: |
          bundle exec ruby -e 'Dir["fastlane/tests/*_test.rb"].sort.each { |p| require_relative p }'
          python3 -B -m unittest discover -s scripts/release -p 'test_*.py'
          node --test scripts/ci/tests/ios-*.test.mjs
          node --test apps/ios/Tests/SharedWebExtension/SafariNavigationIdentityTests.mjs
          corepack pnpm run lint
      - name: Validate workflow syntax
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= .github/workflows/ios-*.yml
  ios-archive:
    if: ${{ inputs.exercise != 'cloud-poc' && (github.event_name != 'pull_request' || toJSON(github.event.pull_request.draft) == 'false') }}
    runs-on: >-
      ${{ vars.AEGIS_IOS_RUNNER_LABEL != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","macOS","ARM64","{0}"]', vars.AEGIS_IOS_RUNNER_LABEL)) || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Require repository Admin for manual operation
        run: node scripts/ci/ios-operator.mjs --context validation
        env:
          GH_TOKEN: ${{ github.token }}
        if: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Verify Apple profile trust regressions without credentials
        run: python3 -B -m unittest scripts.release.test_ios_profile_trust scripts.release.test_development_signing scripts.release.test_development_key_access -v
      # Host enrollment, retained failures and evidence: docs/ci-storage.md.
      - name: Admit unsigned CI storage
        id: storage
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_RUNNER_NAME: ${{ runner.name }}
        run: python3 -I -B scripts/ci/ios-ci-storage.py prepare --runner-environment "$CI_RUNNER_ENVIRONMENT" --runner-name "$CI_RUNNER_NAME"
      # Fork PRs land on macos-26 without mise Go; pin the lock's toolchain for both hosted and self-hosted.
      - name: Install Go for EmbeddedCore prepare
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache: false
      - name: Prepare locked EmbeddedCore XCFramework
        env:
          IOS_CI_ROOT: ${{ steps.storage.outputs.root }}
        run: |
          export MISE_TRUSTED_CONFIG_PATHS="${MISE_TRUSTED_CONFIG_PATHS:-$PWD}"
          if command -v mise >/dev/null 2>&1; then
            GOROOT="$(mise where go@1.27.3 2>/dev/null || true)"
            if [[ -n "${GOROOT:-}" ]]; then
              export GOROOT
              export PATH="$GOROOT/bin:${GOPATH:-$HOME/go}/bin:$PATH"
            fi
          fi
          export GOTOOLCHAIN="${GOTOOLCHAIN:-local}"
          command -v go >/dev/null || { echo "go missing on archive runner" >&2; exit 2; }
          go version | grep -F 'go1.27.3' >/dev/null || { echo "expected go1.27.3 on archive runner" >&2; go version >&2; exit 2; }
          if ! command -v gomobile >/dev/null 2>&1; then
            go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
            export PATH="${GOPATH:-$HOME/go}/bin:$PATH"
            gomobile init
          fi
          # Hosted gomobile slices drift across clean runners; keep source pins
          # strict in the build script, but accept the rebuild digests for archive.
          AEGIS_EMBEDDED_CORE_DIGEST_MODE=ci-rebuild \
            bash scripts/release/prepare-ios-access-core.sh \
              apps/ios/EmbeddedCore/embedded-core-lock.json "$IOS_CI_ROOT/EmbeddedCore"
          test -d "$IOS_CI_ROOT/EmbeddedCore/AegisEmbeddedCore.xcframework"
      - name: Compile uncredentialed native archive
        env:
          IOS_CI_ROOT: ${{ steps.storage.outputs.root }}
        run: |
          export TMPDIR="$IOS_CI_ROOT/tmp"
          export CLANG_MODULE_CACHE_PATH="$IOS_CI_ROOT/ModuleCache"
          python3 -B scripts/release/ios_embedded_core.py verify --root "$PWD" \
            --source-lock apps/ios/EmbeddedCore/embedded-core-lock.json --products "$IOS_CI_ROOT/EmbeddedCore"
          xcodebuild -onlyUsePackageVersionsFromResolvedFile -project apps/ios/Aegis.xcodeproj -scheme Aegis -configuration Release -destination 'generic/platform=iOS' -archivePath "$IOS_CI_ROOT/Aegis.xcarchive" -derivedDataPath "$IOS_CI_ROOT/DerivedData" -clonedSourcePackagesDirPath "$IOS_CI_ROOT/SourcePackages" -packageCachePath "$IOS_CI_ROOT/PackageCache" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO MARKETING_VERSION=1.0.0 CURRENT_PROJECT_VERSION=1 AEGIS_EMBEDDED_CORE_PRODUCTS="$IOS_CI_ROOT/EmbeddedCore" archive > "$IOS_CI_ROOT/xcodebuild.log" 2>&1
          python3 scripts/release/verify-ios-archive.py "$IOS_CI_ROOT/Aegis.xcarchive" 1.0.0 1
          python3 -B scripts/release/test_ios_linked_bundle.py "$IOS_CI_ROOT/Aegis.xcarchive/Products/Applications/Aegis.app" "$IOS_CI_ROOT/EmbeddedCore" "$IOS_CI_ROOT/DerivedData" device
          python3 -I -B scripts/ci/ios-ci-storage.py seal --root "$IOS_CI_ROOT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() && steps.storage.outcome == 'success' }}
        with:
          name: ios-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.storage.outputs.root }}/xcodebuild.log
            ${{ steps.storage.outputs.root }}/storage-receipt.json
            ${{ steps.storage.outputs.root }}/Aegis.xcarchive.zip
            ${{ steps.storage.outputs.root }}/unsigned-artifact.json
            ${{ steps.storage.outputs.root }}/EmbeddedCore/build-manifest.json
            ${{ steps.storage.outputs.root }}/EmbeddedCore/embedded-core-lock.json
          if-no-files-found: error
          retention-days: 14
  cloud-poc:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.exercise == 'cloud-poc' && github.repository == 'gcsagroup/aegis-browser' }}
    runs-on: ${{ fromJSON(format('["self-hosted","macOS","ARM64","{0}"]', vars.AEGIS_IOS_RUNNER_LABEL)) }}
    environment: aegis-ios-cloud-poc
    timeout-minutes: 90
    concurrency:
      group: aegis-ios-cloud-poc
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      AEGIS_IOS_CLOUD_POC_SOURCE_SHA: ${{ vars.AEGIS_IOS_CLOUD_POC_SOURCE_SHA }}
      AEGIS_APPLE_TEAM_ID: ${{ vars.AEGIS_APPLE_TEAM_ID }}
      POC_SOURCE_SHA: ${{ inputs.source_sha }}
      POC_VERSION: ${{ inputs.version }}
      POC_BUILD: ${{ inputs.build }}
      POC_UPLOAD: ${{ inputs.upload }}
      POC_RUN_ID: hosted-${{ github.run_id }}-${{ github.run_attempt }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Admit exact frozen candidate and repository Admin
        run: node scripts/ci/ios-cloud-poc-admission.mjs
      - name: Ensure Ruby 3.3.6 and gems
        uses: ./.github/actions/ensure-ios-ruby
      - name: Check unused build before signing
        env:
          AEGIS_ASC_KEY_ID: ${{ secrets.AEGIS_ASC_KEY_ID }}
          AEGIS_ASC_ISSUER_ID: ${{ secrets.AEGIS_ASC_ISSUER_ID }}
          AEGIS_ASC_KEY_BASE64: ${{ secrets.AEGIS_ASC_KEY_BASE64 }}
        run: bundle exec fastlane ios cloud_poc_preflight
      - name: Install Go for the staged EmbeddedCore build
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache: false
      - name: Fresh archive and cloud export without Distribution P12
        env:
          AEGIS_ASC_KEY_ID: ${{ secrets.AEGIS_ASC_KEY_ID }}
          AEGIS_ASC_ISSUER_ID: ${{ secrets.AEGIS_ASC_ISSUER_ID }}
          AEGIS_ASC_KEY_BASE64: ${{ secrets.AEGIS_ASC_KEY_BASE64 }}
          AEGIS_IOS_FIREBASE_DEV_PLIST_BASE64: ${{ vars.AEGIS_IOS_FIREBASE_DEV_PLIST_BASE64 }}
        run: |
          node scripts/ci/ios-cloud-poc-admission.mjs
          python3 scripts/release/cloud-signing-poc.py --signing-mode cloud --runtime self-hosted --profile beta --version "$POC_VERSION" --build "$POC_BUILD" --team "$AEGIS_APPLE_TEAM_ID" --run-id "$POC_RUN_ID"
      - name: Upload verified IPA and wait for ASC processing without review
        if: ${{ inputs.upload }}
        env:
          AEGIS_ASC_KEY_ID: ${{ secrets.AEGIS_ASC_KEY_ID }}
          AEGIS_ASC_ISSUER_ID: ${{ secrets.AEGIS_ASC_ISSUER_ID }}
          AEGIS_ASC_KEY_BASE64: ${{ secrets.AEGIS_ASC_KEY_BASE64 }}
        run: bundle exec fastlane ios cloud_poc_upload
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: ios-cloud-poc-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/cloud-signing-poc/${{ env.POC_RUN_ID }}/*.ipa
            .artifacts/cloud-signing-poc/${{ env.POC_RUN_ID }}/*.dSYM.zip
            .artifacts/cloud-signing-poc/${{ env.POC_RUN_ID }}/*.json
            .artifacts/cloud-signing-poc/${{ env.POC_RUN_ID }}/*.log
            .artifacts/cloud-signing-state/${{ env.POC_RUN_ID }}/*.json
          if-no-files-found: error
          retention-days: 14
