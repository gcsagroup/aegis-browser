name: iOS Release Validation
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    branches:
      - main
  push:
    branches:
      - main
      - codex/ios-release-*
  workflow_dispatch:
    inputs:
      exercise:
        description: "Existing contracts or frozen cloud signing PoC"
        type: choice
        options: [contracts, cloud-poc]
        default: contracts
      source_sha:
        description: "Full frozen candidate SHA (cloud PoC only)"
        type: string
      version:
        description: "Cloud PoC version"
        type: string
        default: "0.8.0"
      build:
        description: "Unused cloud PoC build number"
        type: string
        default: "500"
      upload:
        description: "Upload verified cloud IPA and wait; no App Review submission"
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ios-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_OPT_OUT_USAGE: "1"
  BUNDLE_FROZEN: "true"
jobs:
  contracts:
    if: ${{ inputs.exercise != 'cloud-poc' && (github.event_name != 'pull_request' || toJSON(github.event.pull_request.draft) == 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Require repository Admin for manual operation
        run: node scripts/ci/ios-operator.mjs --context validation
        env:
          GH_TOKEN: ${{ github.token }}
        if: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Verify installation-token Admin metadata capability
        run: node scripts/ci/ios-operator.mjs --probe-admin-metadata
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: 3.3.6
          bundler-cache: true
      - name: Install locked Node dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Release contracts and regressions
        run: |
          bundle exec ruby -e 'Dir["fastlane/tests/*_test.rb"].sort.each { |p| require_relative p }'
          python3 -B -m unittest discover -s scripts/release -p 'test_*.py'
          node --test scripts/ci/tests/ios-*.test.mjs
          node --test apps/ios/Tests/SharedWebExtension/SafariNavigationIdentityTests.mjs
          corepack pnpm run lint
      - name: Validate workflow syntax
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= .github/workflows/ios-*.yml
  ios-archive:
    if: ${{ inputs.exercise != 'cloud-poc' && (github.event_name != 'pull_request' || toJSON(github.event.pull_request.draft) == 'false') }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Require repository Admin for manual operation
        run: node scripts/ci/ios-operator.mjs --context validation
        env:
          GH_TOKEN: ${{ github.token }}
        if: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Verify Apple profile trust regressions without credentials
        run: python3 -B -m unittest discover -s scripts/release -p test_ios_profile_trust.py -v
      - name: Compile uncredentialed native archive
        run: |
          xcodebuild -onlyUsePackageVersionsFromResolvedFile -project apps/ios/Aegis.xcodeproj -scheme Aegis -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Aegis.xcarchive" -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO MARKETING_VERSION=1.0.0 CURRENT_PROJECT_VERSION=1 archive > "$RUNNER_TEMP/xcodebuild.log" 2>&1
          python3 scripts/release/verify-ios-archive.py "$RUNNER_TEMP/Aegis.xcarchive" 1.0.0 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: ios-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: error
          retention-days: 14
  cloud-poc:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.exercise == 'cloud-poc' && github.repository == 'gcsagroup/aegis-browser' }}
    runs-on: macos-26
    environment: aegis-ios-cloud-poc
    timeout-minutes: 90
    concurrency:
      group: aegis-ios-cloud-poc
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      AEGIS_IOS_CLOUD_POC_SOURCE_SHA: ${{ vars.AEGIS_IOS_CLOUD_POC_SOURCE_SHA }}
      AEGIS_APPLE_TEAM_ID: ${{ vars.AEGIS_APPLE_TEAM_ID }}
      POC_SOURCE_SHA: ${{ inputs.source_sha }}
      POC_VERSION: ${{ inputs.version }}
      POC_BUILD: ${{ inputs.build }}
      POC_UPLOAD: ${{ inputs.upload }}
      POC_RUN_ID: hosted-${{ github.run_id }}-${{ github.run_attempt }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Admit exact frozen candidate and repository Admin
        run: node scripts/ci/ios-cloud-poc-admission.mjs
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: 3.3.6
          bundler-cache: true
      - name: Check unused build before signing
        env:
          AEGIS_ASC_KEY_ID: ${{ secrets.AEGIS_ASC_KEY_ID }}
          AEGIS_ASC_ISSUER_ID: ${{ secrets.AEGIS_ASC_ISSUER_ID }}
          AEGIS_ASC_KEY_BASE64: ${{ secrets.AEGIS_ASC_KEY_BASE64 }}
        run: bundle exec fastlane ios cloud_poc_preflight
      - name: Fresh archive and cloud export without Distribution P12
        env:
          AEGIS_ASC_KEY_ID: ${{ secrets.AEGIS_ASC_KEY_ID }}
          AEGIS_ASC_ISSUER_ID: ${{ secrets.AEGIS_ASC_ISSUER_ID }}
          AEGIS_ASC_KEY_BASE64: ${{ secrets.AEGIS_ASC_KEY_BASE64 }}
          AEGIS_IOS_FIREBASE_DEV_PLIST_BASE64: ${{ vars.AEGIS_IOS_FIREBASE_DEV_PLIST_BASE64 }}
        run: |
          node scripts/ci/ios-cloud-poc-admission.mjs
          python3 scripts/release/cloud-signing-poc.py --signing-mode cloud --runtime github-hosted --profile beta --version "$POC_VERSION" --build "$POC_BUILD" --team "$AEGIS_APPLE_TEAM_ID" --run-id "$POC_RUN_ID"
      - name: Upload verified IPA and wait for ASC processing without review
        if: ${{ inputs.upload }}
        env:
          AEGIS_ASC_KEY_ID: ${{ secrets.AEGIS_ASC_KEY_ID }}
          AEGIS_ASC_ISSUER_ID: ${{ secrets.AEGIS_ASC_ISSUER_ID }}
          AEGIS_ASC_KEY_BASE64: ${{ secrets.AEGIS_ASC_KEY_BASE64 }}
        run: bundle exec fastlane ios cloud_poc_upload
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: ios-cloud-poc-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/cloud-signing-poc/${{ env.POC_RUN_ID }}/*.ipa
            .artifacts/cloud-signing-poc/${{ env.POC_RUN_ID }}/*.dSYM.zip
            .artifacts/cloud-signing-poc/${{ env.POC_RUN_ID }}/*.json
            .artifacts/cloud-signing-poc/${{ env.POC_RUN_ID }}/*.log
            .artifacts/cloud-signing-state/${{ env.POC_RUN_ID }}/*.json
          if-no-files-found: error
          retention-days: 14
