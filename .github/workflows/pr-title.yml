name: PR Title Policy

on:
  pull_request_target:
    branches: [develop, main]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: "${{ github.workflow }}-pr-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  normalize-title:
    name: normalize-pr-title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ github.event.pull_request.base.sha }}"
          persist-credentials: false
          fetch-depth: 1
      - name: Apply PR title policy
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: "${{ github.token }}"
          script: |
            const {pathToFileURL} = require('node:url');
            const moduleUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/ci/pr-title-hook.mjs`).href;
            const hook = await import(moduleUrl);
            await hook.run({github, context, core});
