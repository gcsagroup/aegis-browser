name: iOS TestFlight Existing Package
run-name: iOS TF ${{ inputs.stage }} ${{ inputs.manifest_sha256 }}
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Explicit stage; never rebuilds or submits formal review
        type: choice
        options: [status, wait, upload, compliance, metadata, distribute]
        default: status
      profile:
        description: Immutable original profile
        type: choice
        options: [alpha, beta, release]
        default: alpha
      version: {description: Exact marketing version, type: string, required: true}
      build: {description: Exact existing build, type: string, required: true}
      package_run_id: {description: Original successful package workflow run, type: string, required: true}
      upload_run_id: {description: Latest successful store state run for subsequent stages, type: string}
      source_attempt: {description: Exact current attempt of the selected state or package run, type: string, required: true}
      manifest_sha256: {description: Independently retained original manifest digest, type: string, required: true}
      destination:
        description: Explicit distribution route
        type: choice
        options: [testflight, testflight-internal, testflight-external]
        default: testflight
      groups: {description: Existing group names for distribute only, type: string}
      stage_input: {description: Metadata or explicitly authorized compliance JSON, type: string, default: '{}'}
permissions: {contents: read, actions: read}
concurrency:
  group: ios-store-${{ github.repository }}
  cancel-in-progress: false
env:
  RELEASE_STAGE: ${{ inputs.stage }}
  RELEASE_PROFILE: ${{ inputs.profile }}
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_BUILD: ${{ inputs.build }}
  RELEASE_DESTINATION: ${{ inputs.destination }}
  RELEASE_GROUPS: ${{ inputs.groups }}
  RELEASE_INPUT: ${{ inputs.stage_input }}
  RELEASE_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
  PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
  UPLOAD_RUN_ID: ${{ inputs.upload_run_id }}
  SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
  AEGIS_IOS_RELEASE_ENABLED: ${{ vars.AEGIS_IOS_RELEASE_ENABLED }}
  AEGIS_IOS_FORK_REHEARSAL: ${{ vars.AEGIS_IOS_FORK_REHEARSAL }}
  AEGIS_IOS_FORK_REPOSITORY_ID: ${{ vars.AEGIS_IOS_FORK_REPOSITORY_ID }}
  AEGIS_IOS_FORK_REF: ${{ vars.AEGIS_IOS_FORK_REF }}
  FASTLANE_SKIP_UPDATE_CHECK: '1'
  FASTLANE_HIDE_GITHUB_ISSUES: '1'
  FASTLANE_OPT_OUT_USAGE: '1'
  BUNDLE_FROZEN: 'true'
jobs:
  import:
    name: import
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run_id: ${{ steps.import.outputs.run_id }}
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 22.23.1}
      - run: node scripts/ci/ios-release-preflight.mjs --sha "$GITHUB_SHA"
      - id: import
        run: python3 scripts/release/ios-action.py import
      - name: Export validated state without credentials
        env: {RELEASE_RUN_ID: '${{ steps.import.outputs.run_id }}'}
        run: python3 scripts/release/ios-action.py export
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-validated-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ios-delivery/package.zip
          if-no-files-found: error
          retention-days: 14
  store:
    needs: import
    runs-on: macos-26
    environment: aegis-ios-store
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: ${{ needs.import.outputs.run_id }}
      IMPORT_KIND: store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 22.23.1}
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with: {ruby-version: 3.3.6, bundler-cache: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ios-validated-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/download
      - name: Reverify source and immutable package before loading ASC credentials
        run: |
          python3 scripts/release/ios-restore.py
          node scripts/ci/ios-release-preflight.mjs --sha "$GITHUB_SHA"
      - name: Execute only the selected stage with protected ASC credentials
        env:
          AEGIS_ASC_KEY_ID: ${{ secrets.AEGIS_ASC_KEY_ID }}
          AEGIS_ASC_ISSUER_ID: ${{ secrets.AEGIS_ASC_ISSUER_ID }}
          AEGIS_ASC_KEY_BASE64: ${{ secrets.AEGIS_ASC_KEY_BASE64 }}
        run: python3 scripts/release/ios-action.py stage
      - name: Preserve stage intent even when a response is lost
        if: ${{ always() }}
        run: python3 scripts/release/ios-action.py export
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: ios-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ios-delivery/package.zip
          if-no-files-found: error
          retention-days: 30
