name: iOS Delivery · 精简版 / Simple
run-name: iOS Delivery ${{ inputs.operation || 'package' }} ${{ inputs.version && format('{0}({1})', inputs.version, inputs.build) || github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "操作 / Operation"
        type: choice
        options:
          - 仅打包 / Package
          - 打包并上传 TF / Package and upload
          - 查询状态 / Status
          - 等待处理 / Wait
        default: 查询状态 / Status
      version:
        description: "版本 / Version（例如 / e.g. 1.0.0）"
        type: string
        required: true
      build:
        description: "构建号 / Build（例如 / e.g. 35）"
        type: string
        required: true
      product:
        description: "打包产物 / Package product（查询时忽略 / ignored for Status）"
        type: choice
        options:
          - Alpha · 仅内测 / Internal only
          - Beta · 内外测 / Internal and external
          - Release · 通用 / Universal
        default: Alpha · 仅内测 / Internal only
  workflow_call:
    secrets:
      AEGIS_ASC_KEY_ID:
        required: true
      AEGIS_ASC_ISSUER_ID:
        required: true
      AEGIS_ASC_KEY_BASE64:
        required: true
      AEGIS_IOS_DISTRIBUTION_P12_BASE64:
        required: false
      AEGIS_IOS_DISTRIBUTION_P12_PASSWORD:
        required: false
      AEGIS_IOS_APP_PROFILE_BASE64:
        required: false
      AEGIS_IOS_SAFARI_PROFILE_BASE64:
        required: false
      AEGIS_IOS_SHARE_PROFILE_BASE64:
        required: false
    inputs:
      delivery_mode:
        type: string
        required: true
      delivery_inputs:
        type: string
        required: true
  push:
    tags:
      - candidate/ios/*
permissions:
  contents: read
  actions: read
concurrency:
  group: ios-delivery-${{ github.repository }}
  cancel-in-progress: false
env:
  DELIVERY_MODE: ${{ inputs.delivery_mode || 'simple' }}
  DELIVERY_INPUTS: ${{ inputs.delivery_inputs || toJSON(inputs) }}
  AEGIS_IOS_RELEASE_ENABLED: ${{ vars.AEGIS_IOS_RELEASE_ENABLED }}
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_HIDE_GITHUB_ISSUES: "1"
  FASTLANE_OPT_OUT_USAGE: "1"
  BUNDLE_FROZEN: "true"
  RELEASE_RUN_ID: ios-gh-${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  admission:
    if: ${{ github.repository == 'gcsagroup/aegis-browser' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      operation: ${{ steps.plan.outputs.operation }}
      profile: ${{ steps.plan.outputs.profile }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      destination: ${{ steps.plan.outputs.destination }}
      tag: ${{ steps.plan.outputs.tag }}
      package_run_id: ${{ steps.plan.outputs.package_run_id }}
      upload_run_id: ${{ steps.plan.outputs.upload_run_id }}
      source_attempt: ${{ steps.plan.outputs.source_attempt }}
      manifest_sha256: ${{ steps.plan.outputs.manifest_sha256 }}
      groups: ${{ steps.plan.outputs.groups }}
      stage_input: ${{ steps.plan.outputs.stage_input }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Verify original operator and rerunner are current repository Admins
        run: node scripts/ci/ios-operator.mjs --context delivery
      - id: plan
        name: Normalize exact package or existing-state route
        run: python3 scripts/release/ios-delivery-plan.py
      - name: Reject an earlier unresolved upload for this version and build
        if: ${{ steps.plan.outputs.operation == 'package-upload' }}
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_BUILD: ${{ steps.plan.outputs.build }}
        run: python3 scripts/release/ios-action.py check-new-upload
      - name: Require current upstream main and successful exact-source quality
        run: node scripts/ci/ios-release-preflight.mjs --sha "$GITHUB_SHA"
        env:
          RELEASE_DESTINATION: ${{ steps.plan.outputs.destination }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
  ios-package:
    name: ios-package
    needs:
      - admission
      - check-unused
    runs-on: macos-26
    environment: aegis-ios-signing
    timeout-minutes: 50
    outputs:
      manifest_sha256: ${{ steps.package.outputs.manifest_sha256 }}
    env:
      RELEASE_STAGE: package
      RELEASE_PROFILE: ${{ needs.admission.outputs.profile }}
      RELEASE_VERSION: ${{ needs.admission.outputs.version }}
      RELEASE_BUILD: ${{ needs.admission.outputs.build }}
      RELEASE_DESTINATION: ${{ needs.admission.outputs.destination }}
      RELEASE_TAG: ${{ needs.admission.outputs.tag }}
      PACKAGE_RUN_ID: ${{ needs.admission.outputs.package_run_id }}
      UPLOAD_RUN_ID: ${{ needs.admission.outputs.upload_run_id }}
      SOURCE_ATTEMPT: ${{ needs.admission.outputs.source_attempt }}
      RELEASE_MANIFEST_SHA256: ${{ needs.admission.outputs.manifest_sha256 }}
      RELEASE_GROUPS: ${{ needs.admission.outputs.groups }}
      RELEASE_INPUT: ${{ needs.admission.outputs.stage_input }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      AEGIS_APPLE_TEAM_ID: ${{ vars.AEGIS_APPLE_TEAM_ID }}
      AEGIS_IOS_CERT_SHA1: ${{ vars.AEGIS_IOS_CERT_SHA1 }}
      AEGIS_IOS_PROFILES: ${{ vars.AEGIS_IOS_PROFILES }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: 3.3.6
          bundler-cache: true
      - name: Revalidate source and locked runtime
        run: |
          node scripts/ci/ios-release-preflight.mjs --sha "$GITHUB_SHA"
          bundle check
          xcodebuild -version
      - name: Install signing material on the ephemeral runner
        env:
          AEGIS_IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.AEGIS_IOS_DISTRIBUTION_P12_BASE64 }}
          AEGIS_IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.AEGIS_IOS_DISTRIBUTION_P12_PASSWORD }}
          AEGIS_IOS_APP_PROFILE_BASE64: ${{ secrets.AEGIS_IOS_APP_PROFILE_BASE64 }}
          AEGIS_IOS_SAFARI_PROFILE_BASE64: ${{ secrets.AEGIS_IOS_SAFARI_PROFILE_BASE64 }}
          AEGIS_IOS_SHARE_PROFILE_BASE64: ${{ secrets.AEGIS_IOS_SHARE_PROFILE_BASE64 }}
        run: python3 scripts/release/hosted-signing.py setup
      - id: package
        env:
          AEGIS_IOS_FIREBASE_DEV_PLIST_BASE64: ${{ vars.AEGIS_IOS_FIREBASE_DEV_PLIST_BASE64 }}
          AEGIS_IOS_FIREBASE_PROD_PLIST_BASE64: ${{ vars.AEGIS_IOS_FIREBASE_PROD_PLIST_BASE64 }}
        run: python3 scripts/release/ios-action.py package
      - name: Remove temporary signing material
        if: ${{ always() }}
        run: python3 scripts/release/hosted-signing.py cleanup
      - name: Copy the delivery receipt for the next operation
        run: python3 scripts/release/ios-action.py receipt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ needs.admission.outputs.operation == 'package-upload' && format('ios-package-{0}-{1}', github.run_id, github.run_attempt) || format('ios-delivery-{0}-{1}', github.run_id, github.run_attempt) }}
          path: .artifacts/ios-delivery/package.zip
          if-no-files-found: error
          retention-days: 30
    if: ${{ !cancelled() && needs.admission.result == 'success' && (needs.admission.outputs.operation == 'package' || (needs.admission.outputs.operation == 'package-upload' && needs.check-unused.result == 'success')) }}
  ios-draft:
    if: ${{ needs.admission.outputs.operation == 'package' && needs.admission.outputs.destination == 'github-draft' }}
    needs:
      - admission
      - ios-package
    runs-on: ubuntu-24.04
    environment: aegis-ios-draft
    permissions:
      contents: write
      actions: read
    timeout-minutes: 15
    env:
      RELEASE_STAGE: draft
      RELEASE_PROFILE: ${{ needs.admission.outputs.profile }}
      RELEASE_VERSION: ${{ needs.admission.outputs.version }}
      RELEASE_BUILD: ${{ needs.admission.outputs.build }}
      RELEASE_DESTINATION: ${{ needs.admission.outputs.destination }}
      RELEASE_TAG: ${{ needs.admission.outputs.tag }}
      PACKAGE_RUN_ID: ${{ github.run_id }}
      UPLOAD_RUN_ID: ${{ needs.admission.outputs.upload_run_id }}
      SOURCE_ATTEMPT: ${{ github.run_attempt }}
      RELEASE_MANIFEST_SHA256: ${{ needs.ios-package.outputs.manifest_sha256 }}
      RELEASE_GROUPS: ${{ needs.admission.outputs.groups }}
      RELEASE_INPUT: ${{ needs.admission.outputs.stage_input }}
      GH_TOKEN: ${{ github.token }}
      IMPORT_KIND: draft
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: 3.3.6
          bundler-cache: true
      - name: Download exact package from this running package job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ios-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/download
      - name: Verify source-bound package before Draft
        run: |
          python3 scripts/release/ios-restore.py
          node scripts/ci/ios-release-preflight.mjs --sha "$GITHUB_SHA"
      - run: python3 scripts/release/ios-action.py stage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-draft-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/release/ios/*/github-upload-result.json
          if-no-files-found: error
          retention-days: 30
  import:
    name: import
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run_id: ${{ steps.import.outputs.run_id }}
    env:
      RELEASE_STAGE: ${{ needs.admission.outputs.operation }}
      RELEASE_PROFILE: ${{ needs.admission.outputs.profile }}
      RELEASE_VERSION: ${{ needs.admission.outputs.version }}
      RELEASE_BUILD: ${{ needs.admission.outputs.build }}
      RELEASE_DESTINATION: ${{ needs.admission.outputs.destination }}
      RELEASE_TAG: ${{ needs.admission.outputs.tag }}
      PACKAGE_RUN_ID: ${{ needs.admission.outputs.package_run_id }}
      UPLOAD_RUN_ID: ${{ needs.admission.outputs.upload_run_id }}
      SOURCE_ATTEMPT: ${{ needs.admission.outputs.source_attempt }}
      RELEASE_MANIFEST_SHA256: ${{ needs.admission.outputs.manifest_sha256 }}
      RELEASE_GROUPS: ${{ needs.admission.outputs.groups }}
      RELEASE_INPUT: ${{ needs.admission.outputs.stage_input }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - run: node scripts/ci/ios-release-preflight.mjs --sha "$GITHUB_SHA"
      - id: import
        run: python3 scripts/release/ios-action.py import
      - name: Export validated state without credentials
        env:
          RELEASE_RUN_ID: ${{ steps.import.outputs.run_id }}
        run: python3 scripts/release/ios-action.py export
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-validated-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ios-delivery/package.zip
          if-no-files-found: error
          retention-days: 14
    needs:
      - admission
    if: ${{ needs.admission.outputs.operation != 'package' && needs.admission.outputs.operation != 'package-upload' && needs.admission.outputs.operation != 'status-query' && needs.admission.outputs.operation != 'status-wait' }}
  store:
    needs:
      - admission
      - import
    runs-on: macos-26
    environment: aegis-ios-store
    timeout-minutes: 45
    env:
      RELEASE_STAGE: ${{ needs.admission.outputs.operation }}
      RELEASE_PROFILE: ${{ needs.admission.outputs.profile }}
      RELEASE_VERSION: ${{ needs.admission.outputs.version }}
      RELEASE_BUILD: ${{ needs.admission.outputs.build }}
      RELEASE_DESTINATION: ${{ needs.admission.outputs.destination }}
      RELEASE_TAG: ${{ needs.admission.outputs.tag }}
      PACKAGE_RUN_ID: ${{ needs.admission.outputs.package_run_id }}
      UPLOAD_RUN_ID: ${{ needs.admission.outputs.upload_run_id }}
      SOURCE_ATTEMPT: ${{ needs.admission.outputs.source_attempt }}
      RELEASE_MANIFEST_SHA256: ${{ needs.admission.outputs.manifest_sha256 }}
      RELEASE_GROUPS: ${{ needs.admission.outputs.groups }}
      RELEASE_INPUT: ${{ needs.admission.outputs.stage_input }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: ${{ needs.import.outputs.run_id }}
      IMPORT_KIND: store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: 3.3.6
          bundler-cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ios-validated-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/download
      - name: Reverify source and immutable package before loading ASC credentials
        run: |
          python3 scripts/release/ios-restore.py
          node scripts/ci/ios-release-preflight.mjs --sha "$GITHUB_SHA"
      - name: Execute only the selected stage with protected ASC credentials
        env:
          AEGIS_ASC_KEY_ID: ${{ secrets.AEGIS_ASC_KEY_ID }}
          AEGIS_ASC_ISSUER_ID: ${{ secrets.AEGIS_ASC_ISSUER_ID }}
          AEGIS_ASC_KEY_BASE64: ${{ secrets.AEGIS_ASC_KEY_BASE64 }}
        run: python3 scripts/release/ios-action.py stage
      - name: Preserve stage intent even when a response is lost
        if: ${{ always() }}
        run: python3 scripts/release/ios-action.py export
      - name: Copy the delivery receipt after a successful stage
        run: python3 scripts/release/ios-action.py receipt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: ios-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ios-delivery/package.zip
          if-no-files-found: error
          retention-days: 30
    if: ${{ needs.admission.outputs.operation != 'package' && needs.admission.outputs.operation != 'package-upload' && needs.admission.outputs.operation != 'status-query' && needs.admission.outputs.operation != 'status-wait' }}
  upload-new:
    needs:
      - admission
      - ios-package
    runs-on: macos-26
    environment: aegis-ios-store
    timeout-minutes: 45
    env:
      RELEASE_STAGE: upload
      RELEASE_PROFILE: ${{ needs.admission.outputs.profile }}
      RELEASE_VERSION: ${{ needs.admission.outputs.version }}
      RELEASE_BUILD: ${{ needs.admission.outputs.build }}
      RELEASE_DESTINATION: ${{ needs.admission.outputs.destination }}
      RELEASE_TAG: ${{ needs.admission.outputs.tag }}
      PACKAGE_RUN_ID: ${{ github.run_id }}
      UPLOAD_RUN_ID: ${{ needs.admission.outputs.upload_run_id }}
      SOURCE_ATTEMPT: ${{ github.run_attempt }}
      RELEASE_MANIFEST_SHA256: ${{ needs.ios-package.outputs.manifest_sha256 }}
      RELEASE_GROUPS: ${{ needs.admission.outputs.groups }}
      RELEASE_INPUT: ${{ needs.admission.outputs.stage_input }}
      GH_TOKEN: ${{ github.token }}
      IMPORT_KIND: new-upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: 3.3.6
          bundler-cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ios-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/download
      - name: Reverify source and immutable package before loading ASC credentials
        run: |
          python3 scripts/release/ios-restore.py
          node scripts/ci/ios-release-preflight.mjs --sha "$GITHUB_SHA"
      - name: Execute only the selected stage with protected ASC credentials
        env:
          AEGIS_ASC_KEY_ID: ${{ secrets.AEGIS_ASC_KEY_ID }}
          AEGIS_ASC_ISSUER_ID: ${{ secrets.AEGIS_ASC_ISSUER_ID }}
          AEGIS_ASC_KEY_BASE64: ${{ secrets.AEGIS_ASC_KEY_BASE64 }}
        run: python3 scripts/release/ios-action.py stage
      - name: Preserve stage intent even when a response is lost
        if: ${{ always() }}
        run: python3 scripts/release/ios-action.py export
      - name: Copy the delivery receipt after a successful stage
        run: python3 scripts/release/ios-action.py receipt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: ios-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ios-delivery/package.zip
          if-no-files-found: error
          retention-days: 30
    if: ${{ needs.admission.outputs.operation == 'package-upload' }}
  status-query:
    name: status-query
    needs: admission
    if: ${{ needs.admission.outputs.operation == 'status-query' || needs.admission.outputs.operation == 'status-wait' }}
    runs-on: ubuntu-24.04
    environment: aegis-ios-store
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ needs.admission.outputs.version }}
      RELEASE_BUILD: ${{ needs.admission.outputs.build }}
      RELEASE_QUERY_MODE: ${{ needs.admission.outputs.operation == 'status-wait' && 'wait' || 'status' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: 3.3.6
          bundler-cache: true
      - name: Recheck Admin and current source before loading ASC credentials
        run: node scripts/ci/ios-release-preflight.mjs --sha "$GITHUB_SHA"
      - name: Read exact version and build from Apple using GET only
        env:
          AEGIS_ASC_KEY_ID: ${{ secrets.AEGIS_ASC_KEY_ID }}
          AEGIS_ASC_ISSUER_ID: ${{ secrets.AEGIS_ASC_ISSUER_ID }}
          AEGIS_ASC_KEY_BASE64: ${{ secrets.AEGIS_ASC_KEY_BASE64 }}
        run: bundle exec ruby scripts/release/ios-status.rb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ios-status/status.json
          if-no-files-found: error
          retention-days: 30
  check-unused:
    name: check-unused
    needs: admission
    if: ${{ needs.admission.outputs.operation == 'package-upload' }}
    runs-on: ubuntu-24.04
    environment: aegis-ios-store
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ needs.admission.outputs.version }}
      RELEASE_BUILD: ${{ needs.admission.outputs.build }}
      RELEASE_QUERY_MODE: unused
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: 3.3.6
          bundler-cache: true
      - name: Recheck Admin and current source before loading ASC credentials
        run: node scripts/ci/ios-release-preflight.mjs --sha "$GITHUB_SHA"
      - name: Read exact version and build from Apple using GET only
        env:
          AEGIS_ASC_KEY_ID: ${{ secrets.AEGIS_ASC_KEY_ID }}
          AEGIS_ASC_ISSUER_ID: ${{ secrets.AEGIS_ASC_ISSUER_ID }}
          AEGIS_ASC_KEY_BASE64: ${{ secrets.AEGIS_ASC_KEY_BASE64 }}
        run: bundle exec ruby scripts/release/ios-status.rb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-unused-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ios-status/status.json
          if-no-files-found: error
          retention-days: 30
