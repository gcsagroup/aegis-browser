name: Android Java Coverage

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android-java-coverage:
    name: android-java-coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AEGIS_TESTED_SHA: ${{ github.sha }}
      AEGIS_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
      AEGIS_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      EVIDENCE_DIR: ${{ github.workspace }}/.artifacts/android-java-coverage/github-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out exact tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.AEGIS_TESTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.23.1

      - name: Install Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '21'
          verify-signature: true

      - name: Install exact Android build tools
        run: |
          sdkmanager="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null
          "$sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;36.1.0'

      - name: Run host protocol tests
        run: |
          node --check apps/browser/scripts/android-agent-ui.mjs
          node --test apps/browser/scripts/android-agent-ui_test.mjs apps/browser/scripts/verify-android-agent-target_test.mjs
          bash -n apps/browser/scripts/run-android-java-coverage-emulator.sh

      - name: Fetch fixed JaCoCo and build both helper modes
        run: |
          node apps/browser/scripts/android-agent-ui.mjs fetch-jacoco \
            --output "$RUNNER_TEMP/aegis-jacoco"
          node apps/browser/scripts/android-agent-ui.mjs build \
            --sdk "$ANDROID_SDK_ROOT" \
            --jdk "$JAVA_HOME" \
            --output "$RUNNER_TEMP/aegis-driver-normal"
          node apps/browser/scripts/android-agent-ui.mjs build \
            --sdk "$ANDROID_SDK_ROOT" \
            --jdk "$JAVA_HOME" \
            --output "$RUNNER_TEMP/aegis-driver-coverage" \
            --coverage \
            --jacoco-dir "$RUNNER_TEMP/aegis-jacoco"
          mkdir -p "$EVIDENCE_DIR"
          node apps/browser/scripts/android-agent-ui.mjs verify-build-modes \
            --normal-build "$RUNNER_TEMP/aegis-driver-normal" \
            --coverage-build "$RUNNER_TEMP/aegis-driver-coverage" \
            --output "$EVIDENCE_DIR/build-modes.json"
          install -m 600 "$RUNNER_TEMP/aegis-driver-normal/build.json" "$EVIDENCE_DIR/normal-build.json"
          install -m 600 "$RUNNER_TEMP/aegis-driver-coverage/build.json" "$EVIDENCE_DIR/coverage-build.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const context = {
              eventName: process.env.GITHUB_EVENT_NAME,
              testedSha: process.env.AEGIS_TESTED_SHA,
              pullRequestHeadSha: process.env.AEGIS_PR_HEAD_SHA || null,
              pullRequestBaseSha: process.env.AEGIS_PR_BASE_SHA || null,
            };
            fs.writeFileSync(process.env.EVIDENCE_DIR + "/ci-context.json", JSON.stringify(context, null, 2) + "\n");
          '

      - name: Enable KVM for the dedicated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run six fixtures and collect real Java coverage
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -camera-back none
          script: bash apps/browser/scripts/run-android-java-coverage-emulator.sh

      - name: Bind report to exact SHA and scope
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR + "/coverage/summary.json", "utf8"));
            if (report.testedSha !== process.env.AEGIS_TESTED_SHA || report.repositoryDirtyAtBuild !== false ||
                report.selfTestCases !== 6 || report.browserTested !== false || report.passed !== true ||
                report.line.covered <= 0 || report.line.total !== report.line.covered + report.line.missed) process.exit(1);
          '

      - name: Upload Android Java coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-java-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 14
