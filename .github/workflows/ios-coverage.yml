name: iOS Coverage
on:
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && 'main' || format('dispatch-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ios-coverage:
    name: ios-coverage
    runs-on: macos-26
    # 两台设备依次执行完整原生与 UI 套件，保留完成结果和覆盖率的时间。
    timeout-minutes: 180
    env:
      IOS_REPORT_DIR: /tmp/aegis-ios-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Require repository Admin for manual operation
        run: node scripts/ci/ios-operator.mjs --context coverage
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install Go for the locked EmbeddedCore build
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache: false
      - name: 安装并校验固定版本 XcodeGen
        timeout-minutes: 5
        run: |
          archive="$RUNNER_TEMP/xcodegen-2.46.0.zip"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          printf '%s  %s\n' 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806 "$archive" | shasum -a 256 --check --status
          unzip -q "$archive" -d "$RUNNER_TEMP/xcodegen-2.46.0"
          "$RUNNER_TEMP/xcodegen-2.46.0/xcodegen/bin/xcodegen" --version
          printf '%s\n' "$RUNNER_TEMP/xcodegen-2.46.0/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Run iPhone and iPad tests with Swift coverage
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: bash apps/ios/scripts/run-simulator-tests.sh --execute --output-dir "$IOS_REPORT_DIR"
      - name: Upload Swift coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: swift-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.IOS_REPORT_DIR }}/*.xcresult
            ${{ env.IOS_REPORT_DIR }}/*-xcodebuild.log
            ${{ env.IOS_REPORT_DIR }}/build.log
            ${{ env.IOS_REPORT_DIR }}/fixture.log
            ${{ env.IOS_REPORT_DIR }}/*-summary.json
            ${{ env.IOS_REPORT_DIR }}/*-coverage.json
            ${{ env.IOS_REPORT_DIR }}/*-coverage.txt
            ${{ env.IOS_REPORT_DIR }}/ios-input-sha256-*.txt
            ${{ env.IOS_REPORT_DIR }}/run-metadata.txt
            ${{ env.IOS_REPORT_DIR }}/simulator-runtime.json
          if-no-files-found: error
          retention-days: 14
