name: Ensure iOS Ruby
description: >
  Provide Ruby 3.3.6 and Gemfile deps. On self-hosted macOS, use the runner's
  preinstalled Ruby (mise/tooling PATH) because ruby/setup-ruby hard-codes
  /Users/runner/hostedtoolcache regardless of RUNNER_TOOL_CACHE.
inputs:
  working-directory:
    description: Directory containing the Gemfile
    required: false
    default: '.'
runs:
  using: composite
  steps:
    - name: Use preinstalled Ruby on self-hosted
      if: ${{ runner.environment == 'self-hosted' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        # Prefer a tooling bin that ships both Ruby 3.3.6 and mise. mise Ruby
        # shells out to `mise reshim` on gem install, so mise must stay on PATH.
        selected=""
        for candidate in \
          "${RUNNER_TOOLING_BIN:-}" \
          "${RUNNER_HOME:-}/tooling/bin" \
          "$HOME/.local/bin" \
          /opt/homebrew/bin
        do
          if [ -n "$candidate" ] && [ -x "$candidate/ruby" ] && [ -x "$candidate/mise" ]; then
            selected="$candidate"
            break
          fi
        done
        if [ -z "$selected" ]; then
          for candidate in \
            "${RUNNER_TOOLING_BIN:-}" \
            "${RUNNER_HOME:-}/tooling/bin" \
            "$HOME/.local/bin" \
            /opt/homebrew/bin
          do
            if [ -n "$candidate" ] && [ -x "$candidate/mise" ]; then
              selected="$candidate"
              break
            fi
          done
        fi
        if [ -n "$selected" ]; then
          export PATH="$selected:$PATH"
        fi
        # Explicit mise install path wins over /usr/bin/ruby from the base PATH.
        ruby336_bin="$HOME/.local/share/mise/installs/ruby/3.3.6/bin"
        if [ -x "$ruby336_bin/ruby" ]; then
          export PATH="$ruby336_bin:$PATH"
        fi
        if ! command -v ruby >/dev/null 2>&1; then
          echo "ruby missing on PATH for self-hosted runner" >&2
          exit 1
        fi
        ruby_v="$(ruby -v)"
        echo "Using preinstalled $ruby_v ($(command -v ruby))"
        case "$ruby_v" in
          *"3.3.6"*) ;;
          *)
            echo "expected Ruby 3.3.6 for Gemfile.lock, got: $ruby_v" >&2
            exit 1
            ;;
        esac
        if ! command -v mise >/dev/null 2>&1; then
          echo "mise missing on PATH; gem install would fail reshim" >&2
          exit 1
        fi
        echo "mise: $(command -v mise) ($(mise --version | head -1))"
        # Runner hosts often force a loopback HTTP proxy. When that proxy is
        # down, bundle install fails with opaque network errors — probe first.
        proxy_url="${HTTPS_PROXY:-${https_proxy:-${HTTP_PROXY:-${http_proxy:-}}}}"
        if [[ "$proxy_url" =~ ^[Hh][Tt][Tt][Pp][Ss]?://(127\.0\.0\.1|localhost)(:([0-9]+))? ]]; then
          proxy_port="${BASH_REMATCH[3]:-80}"
          if ! /usr/bin/nc -z -G 2 127.0.0.1 "$proxy_port" >/dev/null 2>&1; then
            echo "loopback proxy $proxy_url is unreachable; clearing proxy env for bundle install" >&2
            unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY all_proxy || true
          else
            echo "loopback proxy reachable on 127.0.0.1:$proxy_port"
          fi
        fi
        bundle -v
        bundle config set --local path vendor/bundle
        bundle install --jobs 4 --retry 3
        bundle check
    - name: Setup Ruby on GitHub-hosted
      if: ${{ runner.environment != 'self-hosted' }}
      uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
      with:
        ruby-version: 3.3.6
        bundler-cache: true
        working-directory: ${{ inputs.working-directory }}
