name: Aegis

options:
  bundleIdPrefix: com.gcsa.aegis
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.4"
  developmentLanguage: zh-Hans
  indentWidth: 2
  tabWidth: 2
  xcodeVersion: "26.0"

configs:
  Debug: debug
  Release: release

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: "13.1.1"

settings:
  base:
    CLANG_ENABLE_MODULES: YES
    AEGIS_EMBEDDED_CORE_PRODUCTS: $(PROJECT_DIR)/../../.artifacts/ios-embedded-core
    CURRENT_PROJECT_VERSION: 127
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "18.4"
    MARKETING_VERSION: "1.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    TARGETED_DEVICE_FAMILY: "1,2"
  configs:
    Debug:
      AEGIS_ACCESS_RELEASE_CHANNEL: dev
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      AEGIS_ACCESS_RELEASE_CHANNEL: release
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  Aegis:
    type: application
    platform: iOS
    sources:
      - path: Shared/AppLocalization.swift
      - path: AegisApp
        excludes:
          - Aegis.entitlements
          - Info.plist
      - path: Shared/ShareInbox.swift
      - path: Shared/MarkdownShareInbox.swift
      - path: Shared/ExternalPageLink.swift
      - path: Shared/SafariReadOnlyGate.swift
      - path: SharedWebExtension
        buildPhase: resources
        excludes:
          - _locales
      - path: SharedWebExtension/_locales
        type: folder
        buildPhase: resources
    dependencies:
      - package: Firebase
        products:
          - FirebaseCore
          - FirebaseCrashlytics
          - FirebaseAnalyticsCore
          - FirebaseRemoteConfig
          - FirebaseInstallations
      - target: BrowserKit
        embed: true
      - target: AegisPolicyKit
        embed: true
      - target: AccessKit
        embed: true
      - target: AgentKit
        embed: true
      - target: SafariWebExtension
        embed: true
      - target: ShareExtension
        embed: true
      - framework: $(AEGIS_EMBEDDED_CORE_PRODUCTS)/AegisEmbeddedCore.xcframework
        embed: true
        codeSign: true
        # AccessKit owns the static Go runtime and callback registry exactly once.
        link: false
    postBuildScripts:
      - name: Select private Access test node
        script: |
          /usr/bin/python3 -B "${SRCROOT}/scripts/private_test_node.py"
        inputFiles:
          - $(SRCROOT)/scripts/private_test_node.py
          - $(AEGIS_PRIVATE_TEST_NODE_FILE)
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AegisPrivateTestNode.vless
        basedOnDependencyAnalysis: false
      - name: Select Aegis Firebase registration
        script: |
          /usr/bin/python3 -B "${SRCROOT}/scripts/firebase_config.py" install \
            --root "${SRCROOT}/Firebase" --channel "${AEGIS_FIREBASE_CHANNEL}" \
            --artifact "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/AegisFirebase.plist"
        inputFiles:
          - $(SRCROOT)/scripts/firebase_config.py
          - $(SRCROOT)/Firebase/identities.json
          - $(SRCROOT)/Firebase/dev/GoogleService-Info.plist
          - $(SRCROOT)/Firebase/prod/GoogleService-Info.plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AegisFirebase.plist
        basedOnDependencyAnalysis: false
    settings:
      configs:
        Debug:
          AEGIS_FIREBASE_CHANNEL: dev
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        Release:
          AEGIS_FIREBASE_CHANNEL: disabled
      base:
        AEGIS_PRIVATE_TEST_NODE_FILE: /dev/null
        OTHER_LDFLAGS: "$(inherited) -ObjC -lresolv"
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(AEGIS_EMBEDDED_CORE_PRODUCTS)
        CODE_SIGN_ENTITLEMENTS: AegisApp/Aegis.entitlements
        INFOPLIST_FILE: AegisApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.gcsa.aegis
        PRODUCT_NAME: Aegis
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO

  BrowserKit:
    type: framework
    platform: iOS
    sources:
      - path: Shared/AppLocalization.swift
      - path: BrowserKit
        excludes:
          - Info.plist
      - path: ../browser/overlay/chrome/browser/resources/aegis/enhancements_shared
        type: folder
        buildPhase: resources
    dependencies:
      - target: AegisPolicyKit
    settings:
      base:
        DEFINES_MODULE: YES
        INFOPLIST_FILE: BrowserKit/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.gcsa.aegis.browserkit
        PRODUCT_NAME: BrowserKit
        SKIP_INSTALL: YES

  AegisPolicyKit:
    type: framework
    platform: iOS
    sources:
      - path: AegisPolicyKit
        excludes:
          - Info.plist
    settings:
      base:
        DEFINES_MODULE: YES
        INFOPLIST_FILE: AegisPolicyKit/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.gcsa.aegis.policykit
        PRODUCT_NAME: AegisPolicyKit
        SKIP_INSTALL: YES

  AccessKit:
    type: framework
    platform: iOS
    sources:
      - path: AccessKit
        excludes:
          - Info.plist
      - path: EmbeddedCore/embedded-core-lock.json
        buildPhase: none
    dependencies:
      # Local Products/ is gitignored; run scripts/release/build-ios-access-core.sh
      # before xcodegen when linking the verified in-process core.
      - framework: $(AEGIS_EMBEDDED_CORE_PRODUCTS)/AegisEmbeddedCore.xcframework
        embed: false
        link: true
    postBuildScripts:
      - name: Install verified EmbeddedCore manifest
        script: |
          /usr/bin/python3 -B "${SRCROOT}/../../scripts/release/ios_embedded_core.py" install --root "${SRCROOT}/../.." --source-lock "${SRCROOT}/EmbeddedCore/embedded-core-lock.json" --products "${AEGIS_EMBEDDED_CORE_PRODUCTS}" --bundle "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
        inputFiles:
          - $(SRCROOT)/../../scripts/release/ios_embedded_core.py
          - $(SRCROOT)/EmbeddedCore/embedded-core-lock.json
          - $(SRCROOT)/EmbeddedCore/bridge
          - $(AEGIS_EMBEDDED_CORE_PRODUCTS)/AegisEmbeddedCore.xcframework
          - $(AEGIS_EMBEDDED_CORE_PRODUCTS)/embedded-core-lock.json
          - $(AEGIS_EMBEDDED_CORE_PRODUCTS)/build-manifest.json
        inputFileLists:
          - $(AEGIS_EMBEDDED_CORE_PRODUCTS)/build-inputs.xcfilelist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/embedded-core-lock.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/embedded-core-build.json
        basedOnDependencyAnalysis: false
    settings:
      base:
        DEFINES_MODULE: YES
        INFOPLIST_FILE: AccessKit/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.gcsa.aegis.accesskit
        PRODUCT_NAME: AccessKit
        SKIP_INSTALL: YES
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(AEGIS_EMBEDDED_CORE_PRODUCTS)
        OTHER_LDFLAGS: $(inherited) -ObjC -lresolv

  AgentKit:
    type: framework
    platform: iOS
    sources:
      - path: Shared/AppLocalization.swift
      - path: AgentKit
        excludes:
          - Info.plist
    dependencies:
      - target: AegisPolicyKit
      - target: BrowserKit
    settings:
      base:
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        DEFINES_MODULE: YES
        INFOPLIST_FILE: AgentKit/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.gcsa.aegis.agentkit
        PRODUCT_NAME: AgentKit
        SKIP_INSTALL: YES

  SafariWebExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SafariWebExtension
        excludes:
          - Info.plist
          - SafariWebExtension.entitlements
      - path: Shared/SafariReadOnlyGate.swift
      - path: SharedWebExtension
        buildPhase: resources
        excludes:
          - _locales
      - path: SharedWebExtension/_locales
        type: folder
        buildPhase: resources
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: SafariWebExtension/SafariWebExtension.entitlements
        INFOPLIST_FILE: SafariWebExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.gcsa.aegis.safari
        PRODUCT_NAME: SafariWebExtension
        SKIP_INSTALL: YES

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared/AppLocalization.swift
      - path: AegisApp/Localizable.xcstrings
      - path: ShareExtension
        excludes:
          - Info.plist
          - ShareExtension.entitlements
      - path: Shared/ShareInbox.swift
      - path: Shared/MarkdownShareInbox.swift
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        INFOPLIST_FILE: ShareExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.gcsa.aegis.share
        PRODUCT_NAME: ShareExtension
        SKIP_INSTALL: YES

  AegisTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AegisTests
        excludes:
          - Info.plist
      - path: Tests/AgentKitTests
      - path: Tests/AegisPolicyKitTests
      - path: Tests/AccessKitTests
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
      - path: ../../packages/core/src/agent/contracts/v1/agent-contract-v1.vectors.json
        buildPhase: resources
    dependencies:
      - target: Aegis
      - target: BrowserKit
      - target: AegisPolicyKit
      - target: AccessKit
      - target: AgentKit
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        INFOPLIST_FILE: Tests/AegisTests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.gcsa.aegis.tests
        PRODUCT_NAME: AegisTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Aegis.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Aegis"

  AegisUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/AegisUITests
        excludes:
          - Info.plist
    dependencies:
      - target: Aegis
    settings:
      base:
        INFOPLIST_FILE: Tests/AegisUITests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.gcsa.aegis.uitests
        PRODUCT_NAME: AegisUITests
        TEST_TARGET_NAME: Aegis

schemes:
  Aegis:
    build:
      targets:
        Aegis: all
        AegisTests: [test]
        AegisUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: AegisTests
          parallelizable: true
        - name: AegisUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  Aegis-Debug:
    build:
      targets:
        Aegis: all
        AegisTests: [test]
        AegisUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: AegisTests
          parallelizable: true
        - name: AegisUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  Aegis-Release:
    build:
      targets:
        Aegis: all
        AegisTests: [test]
        AegisUITests: [test]
    run:
      config: Release
    test:
      config: Release
      gatherCoverageData: false
      targets:
        - name: AegisTests
          parallelizable: true
        - name: AegisUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
