<link rel="stylesheet" href="aegis/enhancements.css">
<style>
 :host { display:block; margin: 24px auto; max-width: 1000px; padding: 0 24px; background: transparent; }
 iframe { display:block; width:100%; min-height:320px; border:0; color-scheme:light dark; }
 settings-downloads-page { display:block; margin-bottom:24px; }
 .hub { display:grid; grid-auto-rows:1fr; gap:12px; }
 .hub a { display:flex; align-items:center; gap:16px; padding:20px; border:1px solid var(--line); border-radius:12px; color:inherit; text-decoration:none; }
 .hub a:hover { background:var(--cr-hover-background-color); }
 .hub a::after { content:'›'; margin-inline-start:auto; font-size:24px; color:var(--cr-secondary-text-color); }
 .hub cr-icon { flex:none; width:24px; height:24px; }
 .hub a > span { min-width:0; overflow-wrap:anywhere; }
 .hub small { display:block; margin-top:4px; color:var(--cr-secondary-text-color); }
 .back { display:inline-block; margin-bottom:20px; }
 .page-title { font-size: 20px; font-weight: 500; margin: 0 0 20px; }
 .setting-row { display:flex; gap:20px; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); }
 .setting-row:last-child { border-bottom:0; }
 :host section { margin:0 0 24px; padding:20px; }
 .setting-row select { max-width:55%; }
 label:not(.setting-row) > input:not([type='checkbox']), label:not(.setting-row) > select { display:block; width:100%; margin-top:8px; }
 .section-heading > h2 { min-width:0; }
 #events { padding-left:20px; }
 .launch-row { display:flex; align-items:center; flex-wrap:wrap; gap:16px; }
 .launch-row > div { flex:1; min-width:200px; }
 .launch-row h2 { margin-bottom:8px; }
 .reading-layout { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr)); gap:24px; }
 .reading-layout > * { min-width:0; }
 .reading-layout .setting-row > select, .reading-layout .setting-row > input { width:140px; max-width:55%; min-width:0; flex:none; }
 .reading-preview-frame { padding:20px; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
 #reading-preview { margin:0 auto; overflow-wrap:anywhere; }
 #reading-preview pre { white-space:pre-wrap; }
 input[type='number'] { width:96px; }
 input[type='checkbox'] { width:18px; flex:none; }
 .managed-row { display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:16px 0; border-bottom:1px solid var(--line); }
 .managed-row > span { flex:1; min-width:180px; overflow-wrap:anywhere; }
 .managed-row small { display:block; color:var(--cr-secondary-text-color); margin-top:6px; }
 form { margin-top:16px; padding:16px; border:1px solid var(--line); border-radius:10px; }
 [data-search-match] { outline:2px solid #3986ec; outline-offset:4px; }
 [role='alert'] { color:var(--google-red-700); }
 @media(max-width:700px) { .setting-row { flex-wrap:wrap; gap:10px; } }
</style>
<template is="dom-if" if="[[!isMode_(mode, 'home')]]"><a class="back" href="/aegis">← $i18n{aegisSettingsTitle}</a></template>
<h1 class="page-title">[[pageTitle_(mode)]]</h1>
<template is="dom-if" if="[[isMode_(mode, 'home')]]"><p>$i18n{aegisSettingsDescription}</p><nav class="hub" aria-label="$i18n{aegisSettingsTitle}">
  <a href="/aegisPrivacy"><cr-icon icon="settings:security"></cr-icon><span><strong>$i18n{aegisPrivacyTitle}</strong><small>$i18n{aegisPrivacyDescription}</small></span></a>
  <a href="/aegisEnhancements"><cr-icon icon="settings:chrome-extension"></cr-icon><span><strong>$i18n{aegisEnhancementsTitle}</strong><small>$i18n{aegisEnhancementsDescription}</small></span></a>
  <a href="/aegisReading"><cr-icon icon="settings:translate"></cr-icon><span><strong>$i18n{aegisReadingTitle}</strong><small>$i18n{aegisReadingDescription}</small></span></a>
  <a href="/aegisGestures"><cr-icon icon="settings:touchpad-mouse"></cr-icon><span><strong>$i18n{aegisGesturesTitle}</strong><small>$i18n{aegisGesturesDescription}</small></span></a>
  <a href="/aegisAi"><cr-icon icon="settings:person"></cr-icon><span><strong>$i18n{aegisAiTitle}</strong><small>$i18n{aegisAiDescription}</small></span></a>
  <a href="/aegisDownloads"><cr-icon icon="settings:download"></cr-icon><span><strong>$i18n{aegisDownloadsTitle}</strong><small>$i18n{aegisDownloadsDescription}</small></span></a>
  <a href="/aegisTools"><cr-icon icon="settings:build"></cr-icon><span><strong>$i18n{aegisToolsTitle}</strong><small>$i18n{aegisToolsDescription}</small></span></a>
  <a href="/aegisExperiments"><cr-icon icon="settings20:insight-spark"></cr-icon><span><strong>$i18n{aegisExperimentsTitle}</strong><small>$i18n{aegisExperimentsDescription}</small></span></a>
</nav></template>
<template is="dom-if" if="[[isMode_(mode, 'enhancements')]]">
  <p id="result" role="status" aria-live="polite"></p>
  <section><div class="section-heading row"><h2>网站规则</h2><button id="rule-new" class="primary">添加网站</button></div>
    <p>为指定网站恢复右键菜单、选取和复制。保存后重新加载网页生效。</p>
    <label>搜索网站<input id="rule-search" type="search" placeholder="输入域名" /></label>
    <div id="rules"></div>
    <form id="rule-editor" hidden>
      <h3 id="rule-title">添加网站</h3>
      <label>从已打开网页选择<select id="rule-tab"><option value="">选择网页（可选）</option></select></label>
      <label>网站地址<input id="rule-origin" type="url" required placeholder="https://example.com" /></label>
      <p id="rule-scope" class="hint"></p><button id="rule-inherited" type="button" hidden>编辑继承的父网站规则</button>
      <label class="setting-row">恢复右键菜单<input id="rule-menu" type="checkbox" /></label>
      <label class="setting-row">允许选取和复制<input id="rule-copy" type="checkbox" /></label>
      <details><summary>高级选项</summary>
        <label class="setting-row">网页调试兼容<input id="rule-debug" type="checkbox" /></label>
        <label class="setting-row">也应用于子域名<input id="rule-subdomains" type="checkbox" /></label>
        <label class="setting-row">暂停本站增强<input id="rule-disabled" type="checkbox" /></label>
        <p class="hint">子域名规则优先于继承的父域规则。此处修改的是上方显示的网站来源。</p>
      </details>
      <p id="rule-error" role="alert"></p>
      <div class="row"><button id="rule-save" class="primary" type="submit">保存网站规则</button><button id="rule-cancel" type="button">取消</button></div>
    </form>
  </section>
  <section class="launch-row"><div><h2>用户脚本</h2><p>编写、导入和管理脚本；试运行时再选择目标网页。</p></div><a href="chrome://aegis/enhancements.html">管理用户脚本 →</a></section>
</template>
<template is="dom-if" if="[[isMode_(mode, 'gestures')]]"><link rel="stylesheet" href="aegis/gestures.css">

    <header>
      <p>按住鼠标右键画出方向，松开执行。支持网页、设置页和内置 PDF 阅读器。</p>
    </header>
    <section aria-labelledby="options-title">
      <h2 id="options-title">基本设置</h2>
      <label class="switch-row"><span><strong>启用鼠标手势</strong><small>右键轻点仍打开菜单。按住 Shift 再右键可临时跳过手势。</small></span><input id="enabled" type="checkbox"></label>
      <label class="switch-row"><span><strong>显示轨迹与动作提示</strong><small>画到哪里、将执行什么，一眼看清。</small></span><input id="showTrail" type="checkbox"></label>
      <label class="threshold" for="threshold">识别距离 <output id="thresholdValue">16</output> 像素</label>
      <input id="threshold" type="range" min="8" max="64" value="16">
      <p class="hint">距离越大，越不容易被小幅抖动触发。斜线方向不明确时不执行；按 Esc 或切换窗口可取消。</p><p id="options-status" role="status" aria-live="polite"></p><button id="resetOptions" type="button">恢复默认基本选项</button>
    </section>
    <section aria-labelledby="practice-title">
      <div class="section-head"><h2 id="practice-title">绘制并设置手势</h2><span class="badge">练习不执行操作</span></div>
      <div id="practice" tabindex="0" role="group" aria-label="手势练习区：按住右键画方向，松开查看结果">
        <svg id="practiceSvg" aria-hidden="true"><polyline id="practiceLine"></polyline></svg>
        <div class="practice-copy"><strong id="practicePattern">按住右键，在这里画一笔</strong><span id="practiceResult" aria-live="polite">上下左右可以组合；松开后查看匹配结果。</span></div>
      </div>
      <div class="direction-buttons" aria-label="使用方向按钮绘制"><button data-direction="L" type="button" aria-label="向左">←</button><button data-direction="R" type="button" aria-label="向右">→</button><button data-direction="U" type="button" aria-label="向上">↑</button><button data-direction="D" type="button" aria-label="向下">↓</button><button id="redraw" type="button">重画</button></div>
      <div id="practice-editor" hidden><label for="practiceAction">执行动作</label><select id="practiceAction"></select><div class="row"><button id="savePractice" type="button" class="primary" disabled>添加并保存</button><button id="cancelPractice" type="button">取消</button></div><p id="practice-status" role="status" aria-live="polite"></p></div>
      <details><summary>手动输入方向</summary><label for="manualPattern">使用 L / R / U / D，最多 8 个方向</label><input id="manualPattern" maxlength="8" placeholder="例如 DR" /><button id="usePattern" type="button">使用这个方向</button></details>
    </section>
    <section aria-labelledby="bindings-title">
      <div class="section-head"><div><h2 id="bindings-title">手势与动作</h2><p class="hint">每条独立保存，最多 64 条。PDF 动作仅在内置阅读器中使用。</p></div><button id="resetBindings" type="button">恢复默认绑定</button></div>
      <div id="bindings"></div><p id="binding-status" role="status" aria-live="polite"></p><button id="undoBinding" type="button" hidden>撤销移除</button>
      <p class="hint">PDF 专用动作仅在内置 PDF 阅读器内生效。普通动作在 PDF 中含义不变。</p>
    </section>
    <section aria-labelledby="sites-title">
      <h2 id="sites-title">这些网站不使用手势</h2>
      <p class="hint">子域名需要单独添加。可以粘贴网址，保存前会提取域名。</p>
      <form id="add-site-form"><label for="newSite">网站域名或地址</label><div class="row"><input id="newSite" placeholder="example.com" required /><button type="submit">添加网站</button></div></form>
      <div id="disabledSiteList"></div><p id="sites-status" role="status" aria-live="polite"></p>
      <details><summary>批量编辑域名</summary><textarea id="disabledSites" rows="3" spellcheck="false" placeholder="example.com"></textarea><div class="row"><button id="saveSites" type="button">保存网站例外</button><button id="cancelSites" type="button">取消</button></div></details>
    </section>
    <p id="status" role="status" aria-live="polite">正在加载设置…</p><button id="reloadSettings" type="button" hidden>重新读取设置</button>
  </template>
<template is="dom-if" if="[[isMode_(mode, 'privacy')]]"><iframe class="legacy-frame" src="chrome://aegis/?settings=privacy" title="$i18n{aegisPrivacyTitle}"></iframe><section><h2>网站权限</h2><p>临时暂停防护请使用当前网站盾牌；浏览器网站权限在下方管理。</p><a href="/content/all">网站权限与数据</a></section><p><a href="chrome://aegis/?workspace=protection">查看防护详情与诊断 →</a></p></template>
<template is="dom-if" if="[[isMode_(mode, 'downloads')]]"><settings-downloads-page aegis-only></settings-downloads-page><section class="launch-row"><div><h2>下载任务</h2><p>新建镜像、种子或磁力下载，查看下载记录。</p></div><a href="chrome://aegis/?workspace=downloads">打开下载中心 →</a></section></template>
<template is="dom-if" if="[[isMode_(mode, 'tools')]]"><iframe class="legacy-frame" src="chrome://aegis/?settings=tools" title="$i18n{aegisToolsTitle}"></iframe></template>
<template is="dom-if" if="[[isMode_(mode, 'ai')]]"><iframe class="legacy-frame" src="chrome://aegis/?settings=ai" title="$i18n{aegisAiTitle}"></iframe>
<iframe class="agent-frame" src="chrome-untrusted://aegis-agent/?settings=1" title="$i18n{aegisAgentSettingsTitle}"></iframe></template>
<template is="dom-if" if="[[isMode_(mode, 'experiments')]]">
  <iframe class="agent-frame" src="chrome-untrusted://aegis-agent/?settings=experiments" title="$i18n{aegisExperimentsTitle}"></iframe>
  <section class="launch-row"><div><h2>阅读工作区</h2><p>打开文档、管理阅读库、翻译和批注。</p></div><a href="chrome://aegis/?workspace=reading">打开阅读工作区 →</a></section>
</template>
<template is="dom-if" if="[[isMode_(mode, 'reading')]]">
  <p id="result" role="status" aria-live="polite"></p>
  <section><div class="section-heading row"><h2>默认阅读外观</h2><button id="reading-reset">恢复默认外观</button></div>
    <p>自动保存，作为新打开文档的默认外观；不会改变已打开的其他文档。</p>
    <div class="reading-layout"><div>
      <label class="setting-row">主题<select id="reading-theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
      <label class="setting-row">字体<select id="reading-family"><option value="sans">系统字体</option><option value="serif">衬线字体</option></select></label>
      <label class="setting-row">字号（12–28 像素）<input id="reading-font" type="number" min="12" max="28" value="17" /></label>
      <label class="setting-row">行距<select id="reading-spacing"><option value="150">紧凑</option><option value="180">标准</option><option value="210">宽松</option></select></label>
      <label class="setting-row">正文宽度<select id="reading-width"><option value="680">窄</option><option value="820">标准</option><option value="1100">宽</option></select></label>
      <p id="reading-status" role="status" aria-live="polite"></p><button id="reading-retry" hidden>重试保存</button>
    </div><div class="reading-preview-frame"><article id="reading-preview" aria-label="阅读外观预览"><h3>阅读外观预览</h3><p>用舒适的字号和行距阅读，让注意力留在内容上。</p><p>Reading should feel clear and comfortable.</p><ul><li>正文和列表</li><li><a href="#" id="preview-link">链接样式</a></li></ul><pre><code>const message = 'Hello';</code></pre></article></div></div>
  </section>
  <section><div class="section-heading row"><h2>Markdown 自动预览网站</h2><button id="markdown-add">添加网站</button></div>
    <p>只在下一次访问该来源的 Markdown 原文时自动预览；不会转换普通网页，也不会授予图片权限。</p>
    <label>搜索网站<input id="markdown-search" type="search" placeholder="输入域名" /></label>
    <form id="markdown-form" hidden><label>网站地址<input id="markdown-origin" type="url" required placeholder="https://example.com" /></label><p id="markdown-scope" class="hint"></p><p id="markdown-error" role="alert"></p><div class="row"><button type="submit" class="primary">添加并开启</button><button type="button" id="markdown-cancel">取消</button></div></form>
    <div id="markdown-sites"></div><p id="markdown-status" role="status" aria-live="polite"></p>
  </section>
  <iframe class="agent-frame" src="chrome-untrusted://aegis-agent/?settings=reading" title="本机翻译语言包"></iframe>
  <section class="launch-row"><div><h2>阅读工作区</h2><p>打开文档、管理阅读库、翻译和批注。</p></div><a href="chrome://aegis/?workspace=reading">打开阅读工作区 →</a><a href="chrome://aegis/markdown.html">打开 Markdown 文件 →</a></section>
</template>
