<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aegis Agent</title>
    <link rel="stylesheet" href="agent.css">
  </head>
  <body>
    <main>
      <header class="hero">
        <img class="mark" src="product_logo.svg" alt="">
        <div class="hero-copy">
          <h1 id="title"></h1>
          <p id="subtitle"></p>
        </div>
        <span id="status" class="status" role="status"></span>
      </header>

      <section id="disabled-banner" class="notice" hidden></section>

      <nav class="workspace-tabs" aria-label="Aegis workspace">
        <button id="task-view-button" type="button" aria-selected="true"></button>
        <button id="automation-view-button" type="button" aria-selected="false"></button>
      </nav>

      <section id="task-view">
        <section class="composer" aria-labelledby="goal-label">
          <label id="goal-label" for="goal"></label>
          <textarea id="goal" rows="5" maxlength="4096" autofocus></textarea>
          <p id="simple-help" class="help"></p>
          <div id="quick-actions" class="scenario-grid" aria-label="Common tasks"></div>
          <button id="plan-button" class="primary primary-large" type="button"></button>
        </section>
      </section>

      <section id="automation-view" class="automation-view" hidden>
        <section class="composer automation-composer" aria-labelledby="automation-title">
          <div>
            <h2 id="automation-title"></h2>
            <p id="automation-help" class="help"></p>
          </div>
          <div id="automation-presets" class="scenario-grid" aria-label="Automation templates"></div>
          <label id="automation-goal-label" for="automation-goal"></label>
          <textarea id="automation-goal" rows="4" maxlength="3000"></textarea>
          <div class="schedule-row">
            <label id="schedule-label" for="automation-schedule"></label>
            <select id="automation-schedule"></select>
          </div>
          <p id="schedule-help" class="help"></p>
          <button id="create-automation-button" class="primary primary-large" type="button"></button>
        </section>

        <section class="card automation-list-card">
          <div class="section-heading">
            <h2 id="automations-title"></h2>
            <span id="automation-count" class="count-badge"></span>
          </div>
          <p id="empty-automations" class="empty"></p>
          <ul id="monitors" class="monitors"></ul>
        </section>
      </section>

      <details id="model-details" class="card model-card">
        <summary>
          <span id="model-settings-label"></span>
          <strong id="model-state"></strong>
        </summary>
        <div class="model-body">
          <p id="model-hint" class="help"></p>
          <div class="field-grid">
            <label for="model-provider" id="provider-label"></label>
            <select id="model-provider">
              <option value="openai">OpenAI compatible</option>
              <option value="anthropic">Anthropic</option>
              <option value="gemini">Gemini</option>
            </select>
            <label for="model-base-url" id="base-url-label"></label>
            <input id="model-base-url" type="url" maxlength="2048" spellcheck="false">
            <label for="model-name" id="model-name-label"></label>
            <input id="model-name" type="text" maxlength="256" spellcheck="false">
            <label for="model-options" id="model-options-label" hidden></label>
            <select id="model-options" hidden></select>
            <label for="model-api-key" id="api-key-label"></label>
            <input id="model-api-key" type="password" maxlength="4096" autocomplete="off" spellcheck="false">
          </div>
          <div class="model-actions">
            <button id="detect-models-button" type="button"></button>
            <button id="save-model-button" class="primary" type="button"></button>
          </div>
          <p id="model-feedback" class="help" role="status"></p>
        </div>
      </details>

      <section id="target-card" class="target-card">
        <span id="target-label" class="eyebrow"></span>
        <strong id="target-value"></strong>
        <small id="invocation-context" hidden></small>
      </section>

      <p id="error" class="error" role="alert" hidden></p>

      <section id="plan-card" class="card" hidden>
        <div class="section-heading">
          <h2 id="scope-title"></h2>
          <span id="risk-badge" class="risk"></span>
        </div>
        <p id="plan-summary"></p>
        <details class="task-details">
          <summary id="details-label"></summary>
          <dl id="scope-grid" class="scope-grid"></dl>
          <ol id="plan-steps" class="steps"></ol>
          <div id="technical-error-group" class="technical-error" hidden>
            <strong id="technical-error-label"></strong>
            <code id="technical-error"></code>
          </div>
        </details>
        <button id="start-button" type="button" hidden disabled></button>
      </section>

      <section id="result-card" class="card result-card" hidden>
        <h2 id="result-title"></h2>
        <p id="result-partial-note" class="help" hidden></p>
        <p id="result-summary"></p>
        <div id="result-sources-group" hidden>
          <strong id="result-sources-label"></strong>
          <ul id="result-sources"></ul>
        </div>
        <div id="unfinished-group" hidden>
          <strong id="unfinished-label"></strong>
          <ul id="unfinished-items"></ul>
        </div>
      </section>

      <section id="approval-card" class="card approval" hidden>
        <h2 id="approval-title"></h2>
        <p id="approval-detail"></p>
        <dl id="checkout-summary" class="scope-grid checkout-summary" hidden></dl>
        <details class="exact-action">
          <summary id="approval-arguments-label"></summary>
          <pre id="approval-arguments"></pre>
          <span id="approval-fingerprint-label"></span>
          <code id="approval-fingerprint"></code>
        </details>
        <p id="takeover-notice" class="takeover-notice" hidden></p>
        <code id="approval-id"></code>
        <button id="approve-button" class="danger" type="button"></button>
      </section>

      <nav class="controls" aria-label="Task controls">
        <button id="pause-button" type="button"></button>
        <button id="resume-button" type="button"></button>
        <button id="takeover-button" type="button"></button>
        <button id="finish-takeover-button" type="button"></button>
        <button id="undo-button" type="button"></button>
        <button id="stop-button" class="quiet-danger" type="button"></button>
      </nav>

      <section class="card activity-card">
        <h2 id="timeline-title"></h2>
        <p id="empty-task" class="empty"></p>
        <ol id="timeline" class="timeline" aria-live="polite"></ol>
      </section>

    </main>
    <script type="module" src="agent.js"></script>
  </body>
</html>
