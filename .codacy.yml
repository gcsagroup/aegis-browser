---
engines:
  sqlint:
    # SQLint parses PostgreSQL. These SQLite migrations are executed by
    # services/access_account/tests, including their STRICT tables and triggers.
    exclude_paths:
      - "services/access_account/credentials.sql"
      - "services/access_account/orders.sql"
exclude_paths:
  - ".artifacts/**"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/dist-worker/**"
  - "**/build/**"
  - "apps/browser/depot_tools/**"
  - "apps/browser/.chromium-root/**"
  - "apps/browser/patches/**"
  - "apps/browser/overlay/third_party/aegis_policy/easylist_compiled.json"
  - "**/*.min.js"
  - "**/*.map"
