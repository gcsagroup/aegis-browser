<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">GCSA Aegis 反白 Logo</title>
  <desc id="desc">纯白色透明底的盾牌、字母 G 与左、右、底三个网络节点。</desc>

  <g id="gcsa-aegis-mark" fill="none" stroke="#FFFFFF" shape-rendering="geometricPrecision">
    <g id="shield">
      <path id="shield-upper" d="M230 429V273C329 252 422 220 512 187C602 220 695 252 794 273V429"
        stroke-width="52" stroke-linecap="butt" stroke-linejoin="round"/>
      <path id="shield-lower-left" d="M239 574C277 681 361 760 456 790"
        stroke-width="52" stroke-linecap="butt"/>
      <path id="shield-lower-right" d="M568 790C663 760 747 681 785 574"
        stroke-width="52" stroke-linecap="butt"/>
    </g>

    <path id="left-network-link" d="M257 506C287 544 329 567 379 579"
      stroke-width="43" stroke-linecap="round"/>

    <g id="letter-g">
      <path id="g-bowl" d="M648 365C615 332 568 321 516 321C428 321 357 392 357 480C357 568 428 639 516 639C604 639 666 581 674 488"
        stroke-width="54" stroke-linecap="butt" stroke-linejoin="round"/>
      <path id="g-crossbar" d="M519 462H773V520H506Z" fill="#FFFFFF" stroke="none"/>
    </g>

    <g id="network-nodes" fill="#FFFFFF" stroke="none">
      <circle id="node-left" cx="226" cy="490" r="47"/>
      <circle id="node-right" cx="810" cy="490" r="47"/>
      <circle id="node-bottom" cx="512" cy="800" r="47"/>
    </g>
  </g>
</svg>
